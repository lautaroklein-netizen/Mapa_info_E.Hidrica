<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#2d6a3f">
<title>Mapa de Datos Hídricos - Vecinal Rincón Norte</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<style>
  :root {
    --verde: #2d6a3f;
    --verde-oscuro: #1b4332;
    --verde-claro: #e9f5ed;
    --verde-muy-claro: #f5faf6;
    --fondo: #f3f4f6;
    --texto: #111827;
    --muted: #4b5563;
    --borde: #e5e7eb;
    --rojo: #dc2626;
    --azul: #2b6cb0;
    --azul-claro: #dbeafe;
    --naranja: #d97706;
    --sombra-sm: 0 2px 8px rgba(0,0,0,0.06);
    --sombra-md: 0 10px 25px -5px rgba(0,0,0,0.10), 0 8px 10px -6px rgba(0,0,0,0.06);
    --sombra-lg: 0 24px 48px rgba(0,0,0,0.20);
    --sombra-zocalo: 0 -4px 16px rgba(0,0,0,0.06);
    --radio-sm: 10px;
    --radio-md: 14px;
    --radio-lg: 20px;
    --header-height: 84px;
    --zocalo-height: 54px;
  }
  * { box-sizing: border-box; }
  html, body {
    margin: 0; padding: 0;
    width: 100%; height: 100%;
    overflow: hidden;
    font-family: 'Inter', system-ui, -apple-system, "Segoe UI", sans-serif;
    background: var(--fondo);
    color: var(--texto);
    -webkit-text-size-adjust: 100%;
  }

  header.app-header {
    position: fixed;
    top: 0; left: 0; right: 0;
    z-index: 2000;
    height: var(--header-height);
    padding: 10px 12px;
    padding-top: calc(10px + env(safe-area-inset-top, 0px));
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 12px;
    color: #fff;
    background: linear-gradient(135deg, var(--verde) 0%, var(--verde-oscuro) 100%);
    box-shadow: 0 4px 16px rgba(27, 67, 50, 0.25);
  }
  header.app-header .logo-caja {
    flex-shrink: 0;
    background: #fff;
    border-radius: 14px;
    padding: 6px 10px;
    display: flex; align-items: center; justify-content: center;
    box-shadow: 0 2px 12px rgba(0,0,0,.18);
    min-width: 68px; min-height: 68px;
    max-width: 130px;
    overflow: hidden;
  }
  header.app-header .logo-caja img {
    max-height: 64px; max-width: 110px;
    width: auto; height: auto;
    object-fit: contain; display: block;
  }
  header.app-header .logo-caja .placeholder-logo {
    font-size: 8px; color: var(--muted);
    text-align: center; line-height: 1.15;
    font-weight: 600; padding: 4px;
  }
  header.app-header .btn-capas-header {
    flex-shrink: 0;
    display: inline-flex; align-items: center; justify-content: center; gap: 8px;
    padding: 0 16px; min-height: 44px;
    background: rgba(255,255,255,0.15);
    border: 1px solid rgba(255,255,255,0.45);
    color: #fff; border-radius: 12px;
    font-family: inherit; font-size: 0.8rem; font-weight: 700;
    cursor: pointer;
    transition: background 0.18s, color 0.18s, border-color 0.18s;
    white-space: nowrap; line-height: 1;
  }
  header.app-header .btn-capas-header:hover { background: rgba(255,255,255,0.28); }
  header.app-header .btn-capas-header.abierto {
    background: #fff; color: var(--verde-oscuro); border-color: #fff;
  }
  header.app-header .btn-capas-header .caret {
    display: inline-block; font-size: 0.6rem; line-height: 1;
    opacity: 0.9; transition: transform 0.2s;
  }
  header.app-header .btn-capas-header.abierto .caret { transform: rotate(180deg); }

  .panel-capas {
    position: fixed;
    top: calc(var(--header-height) + env(safe-area-inset-top, 0px) + 8px);
    right: 12px; z-index: 1999;
    width: 210px; max-width: calc(100vw - 24px);
    background: #fff;
    border: 1px solid var(--borde);
    border-radius: var(--radio-md);
    box-shadow: var(--sombra-lg);
    padding: 6px;
    display: none; overflow: hidden;
  }
  .panel-capas.abierto { display: block; }

  .panel-capas .grupo-titulo {
    font-size: 0.56rem; font-weight: 800;
    text-transform: uppercase; letter-spacing: 1.2px;
    color: var(--muted); padding: 6px 8px 3px;
    opacity: 0.75;
  }
  .panel-capas .grupo-titulo:first-child { padding-top: 2px; }

  .panel-capas .opcion {
    display: flex; align-items: center; gap: 8px;
    width: 100%; text-align: left;
    padding: 8px 10px;
    background: transparent; border: none;
    border-radius: 8px;
    font-family: inherit; font-size: 0.74rem; font-weight: 600;
    color: var(--texto); cursor: pointer;
    transition: background 0.15s, color 0.15s, opacity 0.15s;
  }
  .panel-capas .opcion:hover { background: var(--verde-muy-claro); }
  .panel-capas .opcion.activo {
    background: var(--verde-claro); color: var(--verde-oscuro);
  }
  .panel-capas .opcion .emoji {
    font-size: 0.9rem; width: 18px; text-align: center;
    flex-shrink: 0; line-height: 1;
  }
  .panel-capas .opcion .texto {
    flex: 1; min-width: 0;
    white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
  }
  .panel-capas .opcion .check {
    font-weight: 800; font-size: 0.82rem;
    opacity: 0; transition: opacity 0.15s;
    flex-shrink: 0; color: var(--verde-oscuro);
  }
  .panel-capas .opcion.activo .check { opacity: 1; }
  .panel-capas .separador {
    height: 1px; background: var(--borde); margin: 5px 4px;
  }
  .panel-capas .transparencia-caja {
    padding: 4px 10px 8px;
    display: none; align-items: center; gap: 8px;
  }
  .panel-capas .transparencia-caja.visible { display: flex; }
  .panel-capas .transparencia-caja label {
    font-size: 0.62rem; font-weight: 600; color: var(--muted);
    white-space: nowrap;
  }
  .panel-capas .transparencia-caja input[type="range"] {
    flex: 1; height: 4px;
    -webkit-appearance: none; appearance: none;
    background: var(--borde); border-radius: 2px; outline: none;
  }
  .panel-capas .transparencia-caja input[type="range"]::-webkit-slider-thumb {
    -webkit-appearance: none; appearance: none;
    width: 14px; height: 14px; border-radius: 50%;
    background: var(--verde); cursor: pointer;
    border: 2px solid #fff;
    box-shadow: 0 1px 4px rgba(0,0,0,0.2);
  }
  .panel-capas .transparencia-caja input[type="range"]::-moz-range-thumb {
    width: 14px; height: 14px; border-radius: 50%;
    background: var(--verde); cursor: pointer;
    border: 2px solid #fff;
    box-shadow: 0 1px 4px rgba(0,0,0,0.2);
  }
  .panel-capas .transparencia-caja .valor-opacidad {
    font-size: 0.62rem; font-weight: 700; color: var(--verde-oscuro);
    min-width: 30px; text-align: right;
    font-variant-numeric: tabular-nums;
  }

  #map {
    position: absolute; top: 0; left: 0; right: 0; bottom: 0;
    background: var(--fondo); z-index: 1;
  }
  .leaflet-top {
    top: calc(var(--header-height) + env(safe-area-inset-top, 0px)) !important;
  }
  .leaflet-bottom {
    bottom: calc(var(--zocalo-height) + env(safe-area-inset-bottom, 0px)) !important;
  }
  body.sin-zocalo .leaflet-bottom {
    bottom: env(safe-area-inset-bottom, 0px) !important;
  }

  .zocalo {
    position: fixed; left: 0; right: 0; bottom: 0; z-index: 2001;
    height: calc(var(--zocalo-height) + env(safe-area-inset-bottom, 0px));
    padding-bottom: env(safe-area-inset-bottom, 0px);
    background: #fff;
    border-top: 1px solid var(--borde);
    box-shadow: var(--sombra-zocalo);
    display: flex; align-items: center; gap: 8px;
    padding-left: 12px; padding-right: 8px;
    transform: translateY(100%);
    transition: transform 0.28s ease;
  }
  .zocalo.visible { transform: translateY(0); }
  .zocalo .refs {
    flex: 1; min-width: 0;
    display: flex; align-items: center; gap: 12px;
    overflow-x: auto; overflow-y: hidden;
    -webkit-overflow-scrolling: touch;
    scrollbar-width: none;
    padding: 4px 0;
  }
  .zocalo .refs::-webkit-scrollbar { display: none; }
  .zocalo .ref {
    flex-shrink: 0;
    display: flex; align-items: center; gap: 5px;
    white-space: nowrap;
  }
  .zocalo .ref .icono-ref {
    flex-shrink: 0; width: 18px; height: 18px;
    display: flex; align-items: center; justify-content: center;
  }
  .zocalo .ref .icono-ref.centro {
    background: var(--rojo); border-radius: 50%;
    box-shadow: 0 0 0 2px #fff, 0 1px 3px rgba(220, 38, 38, 0.35);
  }
  .zocalo .ref .icono-ref.peb { position: relative; }
  .zocalo .ref .icono-ref.peb::before {
    content: ''; width: 11px; height: 11px;
    border-radius: 50%; background: var(--verde);
    border: 2px solid #fff;
    box-shadow: 0 1px 3px rgba(45, 106, 63, 0.35);
    display: block;
  }
  .zocalo .ref .icono-ref.via::before {
    content: ''; width: 18px; height: 0;
    border-top: 3px dashed var(--naranja);
    display: block;
  }
  .zocalo .ref .texto-ref {
    font-size: 0.68rem; font-weight: 600;
    color: var(--verde-oscuro); line-height: 1;
  }
  .zocalo .btn-tel {
    flex-shrink: 0;
    width: 36px; height: 36px;
    display: flex; align-items: center; justify-content: center;
    background: var(--verde); color: #fff;
    border: none; border-radius: 50%;
    cursor: pointer;
    box-shadow: 0 2px 8px rgba(45, 106, 63, 0.3);
    transition: background 0.15s, transform 0.1s;
  }
  .zocalo .btn-tel:active {
    transform: scale(0.92);
    background: var(--verde-oscuro);
  }
  .zocalo .btn-tel svg { width: 16px; height: 16px; }

  .popup-overlay {
    position: fixed; inset: 0;
    background: rgba(0, 0, 0, 0.5);
    backdrop-filter: blur(4px);
    -webkit-backdrop-filter: blur(4px);
    z-index: 9999;
    display: none; align-items: center; justify-content: center;
    padding: 12px; opacity: 0;
    transition: opacity 0.25s ease;
  }
  .popup-overlay.visible { display: flex; opacity: 1; }
  .popup-caja {
    background: #fff; border-radius: var(--radio-lg);
    width: 100%; max-width: 420px;
    max-height: calc(100dvh - 24px);
    display: flex; flex-direction: column;
    box-shadow: 0 24px 64px rgba(0,0,0,0.35);
    overflow: hidden;
    transform: translateY(10px) scale(0.98);
    transition: transform 0.25s ease;
  }
  .popup-overlay.visible .popup-caja { transform: translateY(0) scale(1); }
  .popup-header {
    background: linear-gradient(135deg, var(--verde) 0%, var(--verde-oscuro) 100%);
    color: #fff; padding: 14px 20px; text-align: center;
    flex-shrink: 0;
  }
  .popup-header h2 { font-size: 1rem; margin: 0; font-weight: 700; }
  .popup-header .popup-sub { font-size: 0.7rem; opacity: 0.85; margin-top: 2px; }
  .popup-cuerpo {
    padding: 8px 16px; overflow-y: auto;
    flex: 1; min-height: 0;
  }
  .popup-cuerpo .contacto {
    display: flex; gap: 12px;
    padding: 12px 0;
    border-bottom: 1px dashed var(--borde);
  }
  .popup-cuerpo .contacto:last-child { border-bottom: none; }
  .popup-cuerpo .contacto .emoji {
    font-size: 1.2rem; width: 32px; text-align: center;
    flex-shrink: 0; line-height: 1.2;
  }
  .popup-cuerpo .contacto .info { flex: 1; min-width: 0; }
  .popup-cuerpo .contacto .nombre {
    font-size: 0.82rem; font-weight: 700; color: var(--verde-oscuro);
    line-height: 1.2;
  }
  .popup-cuerpo .contacto .detalle {
    font-size: 0.68rem; color: var(--muted); margin-top: 2px;
  }
  .popup-cuerpo .contacto .telefono {
    font-size: 0.88rem; font-weight: 700; color: var(--verde-oscuro);
    margin-top: 5px; display: inline-block;
    background: var(--verde-claro);
    padding: 4px 12px; border-radius: 8px;
  }
  .popup-footer {
    padding: 12px 16px 14px;
    padding-bottom: calc(14px + env(safe-area-inset-bottom, 0px));
    flex-shrink: 0;
    border-top: 1px solid var(--borde);
  }
  .popup-btn-cerrar {
    width: 100%; padding: 13px;
    background: #fff; color: var(--verde-oscuro);
    border: 1px solid var(--verde); border-radius: var(--radio-md);
    font-family: inherit; font-size: 0.85rem; font-weight: 700;
    cursor: pointer; min-height: 48px;
  }

  .pin-ubicacion {
    position: relative;
    width: 38px; height: 38px;
    display: flex; align-items: center; justify-content: center;
  }
  .pin-ubicacion .punto {
    width: 22px; height: 22px;
    border-radius: 50%;
    background: var(--azul);
    border: 3px solid #fff;
    box-shadow: 0 2px 10px rgba(43, 108, 176, 0.55);
  }
  .pin-ubicacion .halo {
    position: absolute; inset: 0; border-radius: 50%;
    background: rgba(43, 108, 176, 0.28);
    animation: pulse-azul 2s ease-in-out infinite;
  }
  @keyframes pulse-azul {
    0%, 100% { transform: scale(0.8); opacity: 0.6; }
    50%      { transform: scale(1.25); opacity: 0.15; }
  }

  .pin-freatico {
    position: relative;
    width: 40px; height: 40px;
    display: flex; align-items: center; justify-content: center;
  }
  .pin-freatico .gota {
    width: 28px; height: 28px;
    border-radius: 50%;
    background: #fff;
    border: 2.5px solid var(--azul);
    box-shadow: 0 3px 10px rgba(43, 108, 176, 0.5);
    display: flex; align-items: center; justify-content: center;
    font-size: 14px; line-height: 1;
    position: relative; z-index: 2;
  }
  .pin-freatico .halo-freatico {
    position: absolute; inset: 0; border-radius: 50%;
    background: rgba(43, 108, 176, 0.30);
    animation: pulse-freatico 2s ease-in-out infinite;
    z-index: 1;
  }
  @keyframes pulse-freatico {
    0%, 100% { transform: scale(0.85); opacity: 0.7; }
    50%      { transform: scale(1.35); opacity: 0.12; }
  }

  .ubicacion-panel {
    position: fixed;
    left: 12px; right: 12px;
    bottom: calc(var(--zocalo-height) + env(safe-area-inset-bottom, 0px) + 12px);
    z-index: 2000;
    background: #fff;
    border: 1px solid var(--borde);
    border-radius: var(--radio-md);
    box-shadow: 0 8px 24px rgba(0,0,0,0.12);
    padding: 10px 14px;
    display: flex; align-items: center; gap: 10px;
    transform: translateY(20px);
    opacity: 0;
    transition: transform 0.25s ease, opacity 0.25s ease;
    pointer-events: none;
  }
  .ubicacion-panel.visible {
    transform: translateY(0); opacity: 1; pointer-events: auto;
  }
  body.sin-zocalo .ubicacion-panel {
    bottom: calc(env(safe-area-inset-bottom, 0px) + 12px);
  }
  .ubicacion-panel .icono {
    flex-shrink: 0; width: 34px; height: 34px;
    border-radius: 50%; background: var(--azul-claro);
    color: var(--azul);
    display: flex; align-items: center; justify-content: center;
  }
  .ubicacion-panel .icono svg { width: 20px; height: 20px; }
  .ubicacion-panel .texto { flex: 1; min-width: 0; }
  .ubicacion-panel .calle {
    font-size: 0.78rem; font-weight: 700;
    color: var(--verde-oscuro); line-height: 1.2;
    white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
  }
  .ubicacion-panel .precision {
    font-size: 0.66rem; color: var(--muted); margin-top: 2px;
  }
  .ubicacion-panel .cerrar {
    flex-shrink: 0; width: 28px; height: 28px;
    border-radius: 50%; background: var(--fondo);
    color: var(--muted); border: none; cursor: pointer;
    display: flex; align-items: center; justify-content: center;
    transition: background 0.15s;
  }
  .ubicacion-panel .cerrar:hover { background: var(--borde); }

  @media (min-width: 768px) {
    .ubicacion-panel {
      max-width: 420px; left: 50%; right: auto;
      transform: translateX(-50%) translateY(20px);
    }
    .ubicacion-panel.visible {
      transform: translateX(-50%) translateY(0);
    }
  }

  .tooltip-via-segura {
    background: rgba(255, 255, 255, 0.96) !important;
    border: 1px solid rgba(217, 119, 6, 0.3) !important;
    border-radius: 8px !important;
    box-shadow: 0 2px 8px rgba(0, 0, 0, 0.15) !important;
    color: #333 !important;
    padding: 4px 8px !important;
    font-family: 'Inter', system-ui, sans-serif !important;
  }
  .tooltip-via-segura::before {
    border-top-color: rgba(255, 255, 255, 0.96) !important;
  }
  .leaflet-overlay-pane svg path:focus,
  .leaflet-overlay-pane svg path:active,
  .leaflet-interactive:focus,
  .leaflet-interactive:active {
    outline: none !important;
    -webkit-tap-highlight-color: transparent !important;
  }

  .leaflet-popup-content-wrapper {
    border-radius: var(--radio-md) !important;
    box-shadow: 0 10px 30px rgba(0,0,0,0.20) !important;
    border: 1px solid var(--borde) !important;
    padding: 0 !important;
  }
  .leaflet-popup-content {
    margin: 0 !important;
    font-family: 'Inter', system-ui, sans-serif !important;
    max-height: calc(100vh - 180px);
    overflow-y: auto;
    -webkit-overflow-scrolling: touch;
  }
  .leaflet-popup-tip {
    box-shadow: 0 3px 14px rgba(0,0,0,0.15) !important;
  }

  .popup-freatico {
    padding: 14px 16px 12px;
    min-width: 290px; max-width: 330px;
  }
  .popup-freatico .pf-titulo {
    font-size: 0.85rem; font-weight: 800;
    color: var(--verde-oscuro); line-height: 1.2;
    display: flex; align-items: center; gap: 6px;
  }
  .popup-freatico .pf-sub {
    font-size: 0.68rem; color: var(--muted); margin-top: 3px;
  }
  .popup-freatico .pf-valor-card {
    margin-top: 12px; padding: 12px;
    background: linear-gradient(135deg, var(--verde-claro) 0%, #f0f8f2 100%);
    border: 1px solid var(--verde);
    border-radius: var(--radio-md);
    text-align: center;
  }
  .popup-freatico .pf-valor-card .pf-label {
    font-size: 0.58rem; font-weight: 800;
    text-transform: uppercase; letter-spacing: 1px;
    color: var(--muted);
  }
  .popup-freatico .pf-valor-card .pf-numero {
    font-size: 1.9rem; font-weight: 800;
    color: var(--verde-oscuro); line-height: 1;
    margin-top: 4px; letter-spacing: -1px;
    font-variant-numeric: tabular-nums;
  }
  .popup-freatico .pf-valor-card .pf-numero .pf-unidad {
    font-size: 0.9rem; color: var(--muted);
    font-weight: 600; letter-spacing: 0;
  }
  .popup-freatico .pf-valor-card .pf-unidad-sub {
    font-size: 0.62rem; color: var(--muted); margin-top: 2px;
  }
  .popup-freatico .pf-valor-card .pf-tendencia {
    display: inline-flex; align-items: center; gap: 5px;
    margin-top: 8px; padding: 4px 10px;
    border-radius: 999px;
    font-size: 0.7rem; font-weight: 800;
    font-variant-numeric: tabular-nums; letter-spacing: -0.2px;
  }
  .popup-freatico .pf-valor-card .pf-tendencia.sube {
    background: rgba(43, 108, 176, 0.12); color: var(--azul);
  }
  .popup-freatico .pf-valor-card .pf-tendencia.baja {
    background: rgba(45, 106, 63, 0.12); color: var(--verde-oscuro);
  }
  .popup-freatico .pf-valor-card .pf-tendencia.estable {
    background: rgba(75, 85, 99, 0.12); color: var(--muted);
  }
  .popup-freatico .pf-valor-card .pf-tendencia .flecha {
    font-size: 0.85rem; line-height: 1;
  }
  .popup-freatico .pf-valor-card .pf-ign {
    margin-top: 8px; padding-top: 8px;
    border-top: 1px dashed rgba(45,106,63,0.25);
    font-size: 0.7rem; font-weight: 700;
    color: var(--azul); font-variant-numeric: tabular-nums;
  }
  .popup-freatico .pf-tabla-titulo {
    font-size: 0.58rem; font-weight: 800;
    text-transform: uppercase; letter-spacing: 1px;
    color: var(--muted);
    margin-top: 12px; margin-bottom: 6px;
  }
  .popup-freatico .pf-tabla-caja {
    max-height: 175px; overflow-y: auto;
    border: 1px solid var(--borde);
    border-radius: var(--radio-sm);
    -webkit-overflow-scrolling: touch;
  }
  .popup-freatico table {
    width: 100%; border-collapse: collapse;
  }
  .popup-freatico thead th {
    position: sticky; top: 0;
    background: #f3f4f6;
    padding: 6px 8px;
    font-size: 0.55rem; font-weight: 800;
    text-transform: uppercase; letter-spacing: 0.6px;
    color: var(--muted); text-align: left;
    border-bottom: 1px solid var(--borde);
  }

function formatearFechaFreatico(fechaISO) {
  const [y, m, d] = fechaISO.split('-');
  const MESES = ['Ene','Feb','Mar','Abr','May','Jun','Jul','Ago','Sep','Oct','Nov','Dic'];
  return `${parseInt(d)} ${MESES[parseInt(m) - 1]} ${y.slice(2)}`;
}

function calcularTendencia(nivelActual, nivelAnterior) {
  if (nivelAnterior == null) return { clase: 'estable', flecha: '—', cm: 0, texto: 'Sin datos previos' };
  const diff = nivelActual - nivelAnterior;
  const cm = Math.round(diff * 100);
  if (cm <= -1) return { clase: 'sube', flecha: '↗', cm: Math.abs(cm), texto: `Sube ${Math.abs(cm)} cm` };
  if (cm >= 1) return { clase: 'baja', flecha: '↘', cm: Math.abs(cm), texto: `Baja ${Math.abs(cm)} cm` };
  return { clase: 'estable', flecha: '—', cm: 0, texto: 'Estable' };
}

const RANGOS_IGN = [
  { min: -Infinity, max: 14.0, color: '#dc2626' },
  { min: 14.0, max: 15.0, color: '#f97316' },
  { min: 15.0, max: 16.0, color: '#eab308' },
  { min: 16.0, max: 17.0, color: '#84cc16' },
  { min: 17.0, max: 18.0, color: '#16a34a' },
  { min: 18.0, max: Infinity, color: '#2563eb' }
];

const PALETA_IGN_VALORES = [12.0, 12.5, 13.0, 13.5, 14.0, 14.5, 15.0, 15.5, 16.0, 16.5, 17.0, 17.5, 18.0, 18.5, 19.0];
const COTAS_IGN_DESC = [...PALETA_IGN_VALORES].sort((a, b) => b - a);

function colorDeRangoIGN(cota) {
  for (const r of RANGOS_IGN) {
    if (cota >= r.min && cota < r.max) return r.color;
  }
  return '#2d6a3f';
}

function labelDeCotaIGN(cota) {
  return String(cota).replace('.', ',');
}

function haversineIGN(lat1, lng1, lat2, lng2) {
  const R = 6371000;
  const dLat = (lat2 - lat1) * Math.PI / 180;
  const dLng = (lng2 - lng1) * Math.PI / 180;
  const a = Math.sin(dLat/2)**2 +
            Math.cos(lat1 * Math.PI/180) * Math.cos(lat2 * Math.PI/180) *
            Math.sin(dLng/2)**2;
  return R * 2 * Math.atan2(Math.sqrt(a), Math.sqrt(1 - a));
}

function puntoEnPoligonoIGN(lat, lng, coords) {
  let dentro = false;
  for (let i = 0, j = coords.length - 1; i < coords.length; j = i++) {
    const yi = coords[i][0], xi = coords[i][1];
    const yj = coords[j][0], xj = coords[j][1];
    const intersecta = ((yi > lat) !== (yj > lat)) &&
      (lng < (xj - xi) * (lat - yi) / (yj - yi) + xi);
    if (intersecta) dentro = !dentro;
  }
  return dentro;
}

// --- Lectura del JSON desde GitHub ---
async function cargarDatosIGN() {
  if (ignCargado) return;

  try {
    const respuesta = await fetch(URL_DATOS_IGN, { cache: 'no-store' });
    if (!respuesta.ok) throw new Error('HTTP ' + respuesta.status);
    const data = await respuesta.json();

    if (data && data.datos) {
      IGN_DATOS.puntos = Array.isArray(data.datos.puntos) ? data.datos.puntos : [];
      IGN_DATOS.trazos = Array.isArray(data.datos.trazos) ? data.datos.trazos : [];
      IGN_DATOS.lineas = Array.isArray(data.datos.lineas) ? data.datos.lineas : [];
    } else {
      throw new Error('Formato inesperado');
    }

    ignCargado = true;
    console.log(`✅ IGN cargado: ${IGN_DATOS.puntos.length}P · ${IGN_DATOS.trazos.length}T · ${IGN_DATOS.lineas.length}L`);
  } catch (err) {
    console.error('❌ Error al cargar datos IGN:', err);
    alert('No se pudieron cargar los datos del IGN.\nVerificá que el JSON esté publicado y la URL sea correcta.');
  }
}

// --- Cálculos ---
function calcularPorCotasIGN(lat, lng) {
  if (IGN_DATOS.puntos.length === 0) return { texto: 'Sin puntos', tipo: 'sin-datos', valor: null };
  const conDist = IGN_DATOS.puntos.map(p => ({
    ...p, dist: haversineIGN(lat, lng, p.lat, p.lng)
  })).sort((a, b) => a.dist - b.dist);

  const cercanos = conDist.slice(0, 5);
  if (cercanos[0].dist > 300) return { texto: 'Sin datos cercanos (>300 m)', tipo: 'sin-datos', valor: null };

  let num = 0, den = 0;
  cercanos.forEach(p => {
    const w = 1 / Math.pow(Math.max(p.dist, 1), 2);
    num += p.cota * w; den += w;
  });
  const estimado = num / den;
  const min = Math.min(...cercanos.map(p => p.cota));
  const max = Math.max(...cercanos.map(p => p.cota));

  return {
    texto: `${estimado.toFixed(2).replace('.', ',')} m · rango ${min.toFixed(2).replace('.', ',')}–${max.toFixed(2).replace('.', ',')}`,
    tipo: 'normal',
    valor: estimado
  };
}

function calcularPorCurvasIGN(lat, lng) {
  if (IGN_DATOS.trazos.length === 0) return { texto: 'Sin trazos', tipo: 'sin-datos', piso: null };
  for (const cota of COTAS_IGN_DESC) {
    const poligonos = IGN_DATOS.trazos.filter(t => t.cota === cota && t.tipo === 'cerrada');
    for (const poligono of poligonos) {
      let coords = poligono.coordenadas;
      if (coords.length > 2) {
        const p0 = coords[0], pN = coords[coords.length - 1];
        if (p0[0] === pN[0] && p0[1] === pN[1]) coords = coords.slice(0, -1);
      }
      if (puntoEnPoligonoIGN(lat, lng, coords)) {
        return {
          texto: `Cota superior a ${labelDeCotaIGN(cota)} m`,
          tipo: 'normal',
          piso: cota
        };
      }
    }
  }
  const cotaMinima = Math.min(...PALETA_IGN_VALORES);
  return {
    texto: `Cota inferior a ${labelDeCotaIGN(cotaMinima)} m`,
    tipo: 'normal',
    piso: cotaMinima - 0.5
  };
}

function calcularCombinadoIGN(lat, lng) {
  const resCurvas = calcularPorCurvasIGN(lat, lng);
  const resPuntos = calcularPorCotasIGN(lat, lng);

  if (resCurvas.tipo === 'sin-datos' && resPuntos.tipo === 'sin-datos') {
    return { texto: 'Sin datos', tipo: 'sin-datos' };
  }
  if (resCurvas.tipo === 'sin-datos') {
    return { texto: `≈ ${resPuntos.texto} (solo puntos)`, tipo: 'normal' };
  }
  if (resPuntos.tipo === 'sin-datos') {
    return { texto: resCurvas.texto + ' (solo curvas)', tipo: 'normal' };
  }

  const piso = resCurvas.piso;
  const estimado = resPuntos.valor;
  const cotaMinima = Math.min(...PALETA_IGN_VALORES);
  const tienePisoReal = (piso >= cotaMinima);

  function rangoCurvas() {
    if (!tienePisoReal) {
      return `por debajo de +${cotaMinima.toFixed(2).replace('.', ',')} IGN`;
    }
    const techo = piso + 0.5;
    return `+${piso.toFixed(2).replace('.', ',')} IGN a +${techo.toFixed(2).replace('.', ',')} IGN`;
  }

  if (estimado === null || piso === null) {
    return { texto: rangoCurvas(), tipo: 'normal' };
  }

  const techoEsperado = piso + 0.5;
  const dentro = estimado >= piso - 0.01 && estimado <= techoEsperado + 0.01;

  if (dentro) {
    return {
      texto: `≈ ${estimado.toFixed(2).replace('.', ',')} m · ${resCurvas.texto.toLowerCase()}`,
      tipo: 'normal',
      consistente: true
    };
  }

  return { texto: rangoCurvas(), tipo: 'normal' };
}

// --- Ejecutar prueba ---
function ejecutarEstimacionIGN(lat, lng) {
  grupoResultadoIGN.clearLayers();
  pinResultadoIGN = null;

  if (!ignCargado) {
    const icono = L.divIcon({
      className: 'pin-prueba-wrapper',
      html: `<div class="pin-prueba">
               <div class="circulo-verde" style="background:#f59e0b; box-shadow: 0 0 0 4px rgba(245,158,11,0.35);"></div>
               <div class="etiqueta-resultado">Cargando datos...</div>
             </div>`,
      iconSize: [40, 70], iconAnchor: [20, 11]
    });
    pinResultadoIGN = L.marker([lat, lng], { icon: icono, interactive: false, zIndexOffset: 1000 });
    pinResultadoIGN.addTo(grupoResultadoIGN);
    return;
  }

  let resultado = calcularCombinadoIGN(lat, lng);
  const claseResultado = resultado.tipo === 'sin-datos' ? 'sin-datos' : '';
  const icono = L.divIcon({
    className: 'pin-prueba-wrapper',
    html: `<div class="pin-prueba">
             <div class="circulo-verde"></div>
             <div class="etiqueta-resultado ${claseResultado}">${resultado.texto}</div>
           </div>`,
    iconSize: [40, 70], iconAnchor: [20, 11]
  });
  pinResultadoIGN = L.marker([lat, lng], { icon: icono, interactive: false, zIndexOffset: 1000 });
  pinResultadoIGN.addTo(grupoResultadoIGN);
}

// --- Listener del click del mapa ---
map.on('click', function(e) {
  if (!estadoCapas.ignEstimado) return;
  ejecutarEstimacionIGN(e.latlng.lat, e.latlng.lng);
});

// ============================================
// UBICACIÓN DEL USUARIO
// ============================================
let ubicacionPin = null;
let ubicacionCirculo = null;

function crearIconoUbicacion() {
  return L.divIcon({
    className: 'icono-ubicacion',
    html: `<div class="pin-ubicacion"><div class="halo"></div><div class="punto"></div></div>`,
    iconSize: [38, 38], iconAnchor: [19, 19]
  });
}

function activarUbicacion() {
  const panel = document.getElementById('ubicacionPanel');
  const calleEl = document.getElementById('ubicacionCalle');
  const precisionEl = document.getElementById('ubicacionPrecision');

  if (!navigator.geolocation) {
    calleEl.textContent = 'Este navegador no permite obtener la ubicación.';
    precisionEl.textContent = '';
    panel.classList.add('visible');
    return;
  }

  panel.classList.add('visible');
  calleEl.textContent = 'Obteniendo ubicación…';
  precisionEl.textContent = 'Consultando el GPS…';

  navigator.geolocation.getCurrentPosition(
    function(posicion) {
      const lat = posicion.coords.latitude;
      const lng = posicion.coords.longitude;
      const precision = Math.round(posicion.coords.accuracy || 0);
      const punto = [lat, lng];

      if (ubicacionPin) map.removeLayer(ubicacionPin);
      if (ubicacionCirculo) map.removeLayer(ubicacionCirculo);

      if (precision > 0) {
        ubicacionCirculo = L.circle(punto, {
          radius: precision, weight: 1, color: '#2b6cb0',
          opacity: 0.6, fillColor: '#2b6cb0', fillOpacity: 0.12
        }).addTo(map);
      }

      ubicacionPin = L.marker(punto, { icon: crearIconoUbicacion() }).addTo(map);
      map.setView(punto, 17);
      precisionEl.textContent = `Precisión: ±${precision} m`;
      obtenerDireccion(lat, lng);
    },
    function(error) {
      const mensajes = {
        1: 'Permiso de ubicación rechazado. Habilitalo en el navegador.',
        2: 'No se pudo determinar la ubicación.',
        3: 'La búsqueda tardó demasiado. Intentá de nuevo.'
      };
      calleEl.textContent = mensajes[error.code] || 'No se pudo obtener la ubicación.';
      precisionEl.textContent = '';
    },
    { enableHighAccuracy: true, timeout: 15000, maximumAge: 0 }
  );
}

function desactivarUbicacion() {
  if (ubicacionPin) { map.removeLayer(ubicacionPin); ubicacionPin = null; }
  if (ubicacionCirculo) { map.removeLayer(ubicacionCirculo); ubicacionCirculo = null; }
  const panel = document.getElementById('ubicacionPanel');
  if (panel) panel.classList.remove('visible');

  estadoCapas.ubicacion = false;
  renderPanelCapas();
}

async function obtenerDireccion(lat, lng) {
  const calleEl = document.getElementById('ubicacionCalle');
  try {
    const params = new URLSearchParams({
      lat: String(lat), lon: String(lng),
      format: 'jsonv2', zoom: '18', addressdetails: '1'
    });
    const respuesta = await fetch(
      `https://nominatim.openstreetmap.org/reverse?${params.toString()}`,
      { headers: { 'Accept-Language': 'es-AR,es;q=0.9' } }
    );
    if (!respuesta.ok) throw new Error('HTTP ' + respuesta.status);
    const data = await respuesta.json();
    if (!data || data.error) throw new Error('Sin dirección');

    const dir = data.address || {};
    const calle = dir.road || dir.pedestrian || dir.path || dir.neighbourhood || '';
    const altura = dir.house_number || '';
    const localidad = dir.city || dir.town || dir.village || dir.municipality || '';
    const direccionBreve = [calle, altura].filter(Boolean).join(' ');
    const textoFinal = [direccionBreve, localidad].filter(Boolean).join(', ') || data.display_name;
    calleEl.textContent = textoFinal;
  } catch (err) {
    calleEl.textContent = 'Ubicación capturada. No se pudo obtener la dirección.';
  }
}

// ============================================
// ZÓCALO
// ============================================
const zocalo = document.getElementById('zocalo');
const body = document.body;

function actualizarZocalo() {
  if (estadoCapas.emergencia) {
    zocalo.classList.add('visible');
    body.classList.remove('sin-zocalo');
  } else {
    zocalo.classList.remove('visible');
    body.classList.add('sin-zocalo');
  }
}

// ============================================
// PANEL DE CAPAS
// ============================================
const btnCapasHeader = document.getElementById('btnCapasHeader');
const panelCapas = document.getElementById('panelCapas');

function renderPanelCapas() {
  const emergenciaBloqueada = !EMERGENCIA_DISPONIBLE;

  panelCapas.innerHTML = `
    <div class="grupo-titulo">Vista</div>
    <button class="opcion ${estadoCapas.base === 'mapa' ? 'activo' : ''}" data-tipo="base" data-valor="mapa">
      <span class="emoji">${ICONOS.mapa}</span>
      <span class="texto">Mapa</span>
      <span class="check">✓</span>
    </button>
    <button class="opcion ${estadoCapas.base === 'satelite' ? 'activo' : ''}" data-tipo="base" data-valor="satelite">
      <span class="emoji">${ICONOS.satelite}</span>
      <span class="texto">Satélite</span>
      <span class="check">✓</span>
    </button>
    <div class="transparencia-caja ${estadoCapas.base === 'satelite' ? 'visible' : ''}" id="transparenciaCaja">
      <label>Transparencia</label>
      <input type="range" id="opacidadSlider" min="0" max="100" value="${Math.round(sateliteEsri.options.opacity * 100)}">
      <span class="valor-opacidad" id="opacidadValor">${Math.round(sateliteEsri.options.opacity * 100)}%</span>
    </div>

    <div class="separador"></div>

    <div class="grupo-titulo">Capas</div>
    <button class="opcion ${estadoCapas.curvas ? 'activo' : ''}" data-tipo="overlay" data-valor="curvas">
      <span class="emoji">${ICONOS.curvas}</span>
      <span class="texto">Curvas de nivel</span>
      <span class="check">✓</span>
    </button>
    <button class="opcion ${estadoCapas.cotas ? 'activo' : ''}" data-tipo="overlay" data-valor="cotas">
      <span class="emoji">${ICONOS.cotas}</span>
      <span class="texto">Puntos de cota IGN</span>
      <span class="check">✓</span>
    </button>
    <button class="opcion ${estadoCapas.emergencia ? 'activo' : ''} ${emergenciaBloqueada ? 'bloqueada' : ''}"
            data-tipo="overlay" data-valor="emergencia"
            ${emergenciaBloqueada ? 'disabled' : ''}>
      <span class="emoji">${ICONOS.emergencia}</span>
      <span class="texto">Emergencia Hídrica</span>
      <span class="check">✓</span>
    </button>
    <button class="opcion ${estadoCapas.freatico ? 'activo' : ''}" data-tipo="overlay" data-valor="freatico">
      <span class="emoji">${ICONOS.freatico}</span>
      <span class="texto">Nivel freático</span>
      <span class="check">✓</span>
    </button>
    <button class="opcion ${estadoCapas.ignEstimado ? 'activo' : ''}" data-tipo="overlay" data-valor="ignEstimado">
      <span class="emoji">${ICONOS.ignEstimado}</span>
      <span class="texto">IGN estimado</span>
      <span class="check">✓</span>
    </button>

    <div class="separador"></div>

    <button class="opcion ${estadoCapas.ubicacion ? 'activo' : ''}" data-tipo="overlay" data-valor="ubicacion">
      <span class="emoji">${ICONOS.ubicacion}</span>
      <span class="texto">Mi ubicación</span>
      <span class="check">✓</span>
    </button>
  `;

  panelCapas.querySelectorAll('.opcion').forEach(btn => {
    btn.addEventListener('click', (e) => {
      e.stopPropagation();
      if (btn.disabled) return;

      const tipo = btn.dataset.tipo;
      const valor = btn.dataset.valor;

      if (tipo === 'base') {
        if (estadoCapas.base === valor) return;
        if (valor === 'mapa') {
          map.removeLayer(sateliteEsri);
          mapaBase.addTo(map);
        } else {
          map.removeLayer(mapaBase);
          sateliteEsri.addTo(map);
        }
        estadoCapas.base = valor;
      } else if (valor === 'ubicacion') {
        if (estadoCapas.ubicacion) {
          desactivarUbicacion();
          return;
        } else {
          estadoCapas.ubicacion = true;
          activarUbicacion();
          cerrarPanelCapas();
          return;
        }
      } else {
        estadoCapas[valor] = !estadoCapas[valor];
        const capa = valor === 'curvas' ? capaCurvasYDefensas
                   : valor === 'cotas' ? capaPuntosCota
                   : valor === 'freatico' ? capaFreatico
                   : valor === 'ignEstimado' ? capaIGNEstimado
                   : capaEmergenciaHidrica;

        if (estadoCapas[valor]) {
          capa.addTo(map);

          if (valor === 'emergencia') {
            if (estadoCapas.curvas) { map.removeLayer(capaCurvasYDefensas); estadoCapas.curvas = false; }
            if (estadoCapas.cotas) { map.removeLayer(capaPuntosCota); estadoCapas.cotas = false; }
            if (estadoCapas.base === 'satelite') {
              map.removeLayer(sateliteEsri);
              mapaBase.addTo(map);
              estadoCapas.base = 'mapa';
            }
            setTimeout(() => centrarEnEmergenciaHidrica(), 300);
            cerrarPanelCapas();
          }

          if (valor === 'freatico') {
            if (!freaticoYaCentrado) {
              freaticoYaCentrado = true;
              setTimeout(() => {
                map.setView([FREATIMETRO.lat, FREATIMETRO.lng], 16, { animate: true });
                setTimeout(() => marcadorFreatico.openPopup(), 500);
              }, 250);
            }
            cerrarPanelCapas();
          }

          if (valor === 'ignEstimado') {
            cargarDatosIGN();
            document.getElementById('map').style.cursor = 'crosshair';
            cerrarPanelCapas();
          }
        } else {
          map.removeLayer(capa);
          if (valor === 'emergencia') {
            map.setView(CENTRO_MAPA, ZOOM_INICIAL);
          }
          if (valor === 'ignEstimado') {
            document.getElementById('map').style.cursor = '';
            grupoResultadoIGN.clearLayers();
            pinResultadoIGN = null;
          }
        }

        actualizarZocalo();
      }

      renderPanelCapas();
    });
  });

  const slider = document.getElementById('opacidadSlider');
  const valorEl = document.getElementById('opacidadValor');
  if (slider) {
    slider.addEventListener('input', (e) => {
      e.stopPropagation();
      const v = parseInt(slider.value);
      sateliteEsri.setOpacity(v / 100);
      valorEl.textContent = v + '%';
    });
    slider.addEventListener('click', (e) => e.stopPropagation());
  }
}

function abrirPanelCapas() {
  panelCapas.classList.add('abierto');
  btnCapasHeader.classList.add('abierto');
  btnCapasHeader.setAttribute('aria-expanded', 'true');
}

function cerrarPanelCapas() {
  panelCapas.classList.remove('abierto');
  btnCapasHeader.classList.remove('abierto');
  btnCapasHeader.setAttribute('aria-expanded', 'false');
}

renderPanelCapas();

btnCapasHeader.addEventListener('click', (e) => {
  e.stopPropagation();
  if (panelCapas.classList.contains('abierto')) cerrarPanelCapas();
  else abrirPanelCapas();
});

document.addEventListener('click', (e) => {
  if (!e.target.closest('#panelCapas') && !e.target.closest('#btnCapasHeader')) {
    cerrarPanelCapas();
  }
});

actualizarZocalo();
setTimeout(() => map.invalidateSize(), 200);

</script>
