<!DOCTYPE html>
<html>
<head>
    <title>Mapa con Curvas de Nivel - IDESF</title>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <style>
        /* ==============================================
           RESET Y CONFIGURACIÓN
           ============================================== */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        html, body {
            width: 100%;
            height: 100%;
            overflow: hidden;
            background: #e8f5e9;
        }

        #map { 
            width: 100%;
            height: 100vh;
            height: 100dvh;
            background: #e8f5e9;
            position: relative;
            z-index: 1;
        }

        /* ==============================================
           LOGO DE LA VECINAL
           ============================================== */
        .logo-vecinal {
            background: rgba(255, 255, 255, 0.92);
            backdrop-filter: blur(8px);
            padding: 10px 16px;
            border-radius: 14px;
            box-shadow: 0 2px 16px rgba(0, 0, 0, 0.12);
            border: 1px solid rgba(255, 255, 255, 0.3);
            margin: 12px 0 0 12px;
            display: flex;
            align-items: center;
            gap: 12px;
            max-width: 240px;
            transition: all 0.3s ease;
        }
        .logo-vecinal img {
            max-height: 64px;
            width: auto;
            display: block;
        }
        .logo-vecinal .logo-texto {
            font-size: 16px;
            font-weight: 700;
            color: #1c6622;
            line-height: 1.3;
        }
        .logo-vecinal .logo-texto small {
            display: block;
            font-weight: 400;
            font-size: 11px;
            color: #666;
        }

        @media (max-width: 480px) {
            .logo-vecinal {
                padding: 8px 12px;
                max-width: 180px;
                margin: 10px 0 0 10px;
            }
            .logo-vecinal img {
                max-height: 48px;
            }
            .logo-vecinal .logo-texto {
                font-size: 13px;
            }
            .logo-vecinal .logo-texto small {
                font-size: 9px;
            }
        }

        /* ==============================================
           BOTÓN MINIMIZAR/MOSTRAR CAPAS (PULSANTE)
           ============================================== */
        .btn-toggle-capas {
            position: absolute;
            top: 12px;
            right: 12px;
            z-index: 1001;
            background: rgba(255, 255, 255, 0.92);
            backdrop-filter: blur(8px);
            border: 2px solid #2e9d36;
            border-radius: 50%;
            width: 48px;
            height: 48px;
            font-size: 22px;
            cursor: pointer;
            box-shadow: 0 2px 16px rgba(46, 157, 54, 0.25);
            transition: all 0.3s ease;
            display: flex;
            align-items: center;
            justify-content: center;
            color: #2e9d36;
        }
        .btn-toggle-capas:active {
            transform: scale(0.88);
        }
        .btn-toggle-capas.oculto {
            background: rgba(46, 157, 54, 0.95);
            color: white;
            border-color: #1c6622;
            box-shadow: 0 2px 20px rgba(46, 157, 54, 0.4);
        }

        .btn-toggle-capas.pulsante {
            animation: pulse-boton 1.8s ease-in-out infinite;
            box-shadow: 0 0 0 0 rgba(46, 157, 54, 0.5);
        }
        
        @keyframes pulse-boton {
            0% {
                transform: scale(1);
                box-shadow: 0 0 0 0 rgba(46, 157, 54, 0.5);
            }
            50% {
                transform: scale(1.08);
                box-shadow: 0 0 0 12px rgba(46, 157, 54, 0);
            }
            100% {
                transform: scale(1);
                box-shadow: 0 0 0 0 rgba(46, 157, 54, 0);
            }
        }

        .btn-toggle-capas .badge {
            position: absolute;
            top: -4px;
            right: -4px;
            background: #FF6F00;
            color: white;
            font-size: 8px;
            font-weight: 700;
            padding: 2px 6px;
            border-radius: 10px;
            border: 2px solid white;
            min-width: 16px;
            text-align: center;
        }

        @media (max-width: 480px) {
            .btn-toggle-capas {
                width: 42px;
                height: 42px;
                font-size: 18px;
                top: 10px;
                right: 10px;
            }
            .btn-toggle-capas .badge {
                font-size: 7px;
                padding: 1px 5px;
                min-width: 14px;
                top: -3px;
                right: -3px;
            }
        }

        /* ==============================================
           CONTROL DE CAPAS
           ============================================== */
        .leaflet-control-layers {
            border: 2px solid #2e9d36 !important;
            border-radius: 11px !important;
            box-shadow: 0 2px 14px rgba(0,0,0,0.15) !important;
            background: rgba(255,255,255,0.95) !important;
            padding: 5px 10px !important;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Arial, sans-serif !important;
            font-size: 14px !important;
            backdrop-filter: blur(4px) !important;
            max-width: 240px !important;
            transition: all 0.4s ease !important;
            max-height: 500px !important;
            opacity: 1 !important;
            overflow: visible !important;
            margin: 0 !important;
        }
        .leaflet-control-layers.minimizado {
            max-height: 0 !important;
            padding: 0 10px !important;
            overflow: hidden !important;
            opacity: 0 !important;
            border-width: 0 !important;
            margin: 0 !important;
            pointer-events: none !important;
            transform: scale(0.9) !important;
        }
        .leaflet-control-layers label {
            font-size: 14px !important;
            font-weight: 500 !important;
            color: #333 !important;
            display: flex !important;
            align-items: center !important;
            gap: 5px !important;
            padding: 3px 0 !important;
            cursor: pointer !important;
            white-space: nowrap !important;
        }
        .leaflet-control-layers input[type="checkbox"],
        .leaflet-control-layers input[type="radio"] {
            width: 18px !important;
            height: 18px !important;
            accent-color: #2e9d36 !important;
            cursor: pointer !important;
            flex-shrink: 0 !important;
        }
        .leaflet-control-layers .leaflet-control-layers-separator {
            border-top: 1px solid #e0e0e0 !important;
            margin: 4px 0 !important;
        }
        .leaflet-control-layers-base {
            border-bottom: 2px solid #2e9d36 !important;
            padding-bottom: 4px !important;
            margin-bottom: 4px !important;
        }
        .leaflet-control-layers-base label {
            font-weight: 700 !important;
            color: #1c6622 !important;
        }

        /* OCULTAR BOLAS DE COLOR EN EL PANEL */
        .leaflet-control-layers .icono-satelite,
        .leaflet-control-layers .icono-mapa,
        .leaflet-control-layers .icono-curvas,
        .leaflet-control-layers .icono-puntos-cota,
        .leaflet-control-layers .icono-centros-ev {
            display: none !important;
        }

        /* Reducir tamaño del emoji de cota */
        .icono-cota-pequeno {
            display: inline-block;
            font-size: 11px;
            line-height: 1;
            transform: scale(0.85);
            transform-origin: center;
        }

        /* ==============================================
           LEYENDA (MINIMIZABLE Y REUBICADA)
           ============================================== */
        .legend {
            position: absolute;
            bottom: 40px;
            left: 12px;
            background: rgba(255, 255, 255, 0.96);
            backdrop-filter: blur(8px);
            border-radius: 14px;
            box-shadow: 0 2px 16px rgba(0, 0, 0, 0.12);
            z-index: 1000;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Arial, sans-serif;
            font-size: 13px;
            border: 1px solid rgba(255, 255, 255, 0.3);
            min-width: 180px;
            display: none;
            max-width: 210px;
            transition: all 0.3s ease;
            overflow: hidden;
        }
        .legend.visible {
            display: block;
        }
        .legend-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 10px 14px;
            cursor: pointer;
            user-select: none;
            gap: 10px;
        }
        .legend-header:active {
            background: rgba(0, 0, 0, 0.03);
        }
        .legend-title {
            font-weight: 700;
            color: #1c6622;
            font-size: 14px;
            flex: 1;
            white-space: nowrap;
        }
        .legend-toggle {
            background: rgba(46, 157, 54, 0.1);
            border: none;
            color: #2e9d36;
            font-size: 12px;
            font-weight: 700;
            cursor: pointer;
            width: 28px;
            height: 28px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: all 0.2s ease;
            flex-shrink: 0;
        }
        .legend-toggle:active {
            transform: scale(0.9);
            background: rgba(46, 157, 54, 0.2);
        }
        .legend-body {
            padding: 0 14px 12px 14px;
            max-height: 500px;
            transition: all 0.3s ease;
            overflow: hidden;
        }
        .legend-body.colapsado {
            max-height: 0;
            padding: 0 14px;
            opacity: 0;
        }
        .legend-item {
            display: flex;
            align-items: center;
            gap: 10px;
            margin: 5px 0;
            padding: 2px 0;
        }
        .legend-icon {
            width: 20px;
            height: 20px;
            border-radius: 50%;
            flex-shrink: 0;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 10px;
            font-weight: 700;
            color: white;
            border: 2px solid rgba(0, 0, 0, 0.1);
        }
        .legend-icon.centro {
            background: #D32F2F;
            font-size: 10px;
        }
        .legend-icon.punto-encuentro {
            background: #388E3C;
            font-size: 14px;
            border: 2px solid rgba(255,255,255,0.3);
        }
        .legend-icon.via-segura {
            background: transparent;
            height: 0px;
            border-top: 4px dashed #FF6F00;
            width: 30px;
            border-radius: 0;
        }
        .legend-label {
            color: #333;
            font-size: 12px;
            font-weight: 500;
            line-height: 1.2;
        }
        .legend-label small {
            display: block;
            font-weight: 400;
            font-size: 9px;
            color: #777;
            margin-top: 1px;
        }
   
/* Tooltip de vías seguras */
.tooltip-via-segura {
    background: rgba(255, 255, 255, 0.96) !important;
    border: 1px solid rgba(255, 111, 0, 0.3) !important;
    border-radius: 8px !important;
    box-shadow: 0 2px 8px rgba(0, 0, 0, 0.15) !important;
    color: #333 !important;
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Arial, sans-serif !important;
    padding: 4px 8px !important;
}
.tooltip-via-segura::before {
    border-top-color: rgba(255, 255, 255, 0.96) !important;
}

/* Quitar el outline/cuadro de foco en las vías seguras (SVG de Leaflet) */
.leaflet-overlay-pane svg path:focus,
.leaflet-overlay-pane svg path:active,
.leaflet-interactive:focus,
.leaflet-interactive:active {
    outline: none !important;
    -webkit-tap-highlight-color: transparent !important;
}

   /* BOTÓN TELÉFONOS VERDE CON SVG BLANCO */
        .legend-telefonos {
            margin-top: 10px;
            padding-top: 10px;
            border-top: 2px solid #e0e0e0;
        }
        .btn-telefonos {
            width: 100%;
            background: #2E7D32;
            color: #FFFFFF;
            border: none;
            padding: 9px 12px;
            border-radius: 10px;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Arial, sans-serif;
            font-size: 12px;
            font-weight: 600;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            transition: all 0.2s ease;
            box-shadow: 0 2px 8px rgba(46, 125, 50, 0.3);
        }
        .btn-telefonos:active {
            transform: scale(0.95);
            background: #1B5E20;
        }
        .btn-telefonos svg {
            flex-shrink: 0;
        }

        /* POPUP DE TELÉFONOS */
        .telefonos-popup {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.5);
            backdrop-filter: blur(4px);
            z-index: 9999;
            display: none;
            align-items: center;
            justify-content: center;
            animation: fadeIn 0.3s ease;
        }
        .telefonos-popup.visible {
            display: flex;
        }
        @keyframes fadeIn {
            from { opacity: 0; transform: scale(0.9); }
            to { opacity: 1; transform: scale(1); }
        }
        .telefonos-popup-content {
            background: white;
            border-radius: 20px;
            padding: 24px 28px;
            max-width: 340px;
            width: 90%;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
            position: relative;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Arial, sans-serif;
        }
        .telefonos-popup-content .cerrar {
            position: absolute;
            top: 12px;
            right: 16px;
            background: none;
            border: none;
            font-size: 24px;
            cursor: pointer;
            color: #999;
            transition: all 0.2s;
            padding: 4px 8px;
        }
        .telefonos-popup-content .cerrar:active {
            transform: scale(0.8);
            color: #333;
        }
        .telefonos-popup-content .popup-titulo {
            font-size: 16px;
            font-weight: 700;
            color: #1c6622;
            margin-bottom: 16px;
            border-bottom: 2px solid #e0e0e0;
            padding-bottom: 10px;
        }
        .telefonos-popup-content .contacto {
            display: flex;
            align-items: flex-start;
            gap: 12px;
            padding: 10px 0;
            border-bottom: 1px solid #f0f0f0;
        }
        .telefonos-popup-content .contacto:last-child {
            border-bottom: none;
        }
        .telefonos-popup-content .contacto .emoji {
            font-size: 20px;
            width: 32px;
            text-align: center;
            flex-shrink: 0;
            margin-top: 2px;
        }
        .telefonos-popup-content .contacto .info {
            flex: 1;
        }
        .telefonos-popup-content .contacto .info .nombre {
            font-size: 13px;
            font-weight: 600;
            color: #333;
        }
        .telefonos-popup-content .contacto .info .detalle {
            font-size: 11px;
            font-weight: 400;
            color: #666;
            margin-top: 2px;
        }
        .telefonos-popup-content .contacto .info .telefono {
            font-size: 15px;
            font-weight: 700;
            color: #2E7D32;
            margin-top: 4px;
            display: inline-block;
            background: #E8F5E9;
            padding: 2px 12px;
            border-radius: 6px;
        }

        @media (max-width: 480px) {
            .telefonos-popup-content {
                padding: 20px 20px;
                max-width: 300px;
            }
            .telefonos-popup-content .popup-titulo {
                font-size: 14px;
            }
            .telefonos-popup-content .contacto .info .nombre {
                font-size: 12px;
            }
            .telefonos-popup-content .contacto .info .telefono {
                font-size: 13px;
            }
            .telefonos-popup-content .contacto .info .detalle {
                font-size: 10px;
            }
            .legend {
                bottom: 40px;
                left: 10px;
                min-width: 150px;
                max-width: 180px;
                border-radius: 12px;
            }
            .legend-header {
                padding: 9px 12px;
            }
            .legend-title {
                font-size: 13px;
            }
            .legend-toggle {
                width: 26px;
                height: 26px;
                font-size: 11px;
            }
            .legend-body {
                padding: 0 12px 10px 12px;
            }
            .legend-label {
                font-size: 11px;
            }
            .legend-label small {
                font-size: 8px;
            }
            .legend-icon {
                width: 16px;
                height: 16px;
                font-size: 8px;
            }
            .legend-icon.via-segura {
                width: 24px;
                border-top-width: 3px;
            }
            .legend-item {
                gap: 8px;
                margin: 4px 0;
            }
            .btn-telefonos {
                font-size: 11px;
                padding: 7px 10px;
            }
        }

        /* ==============================================
           CONTROL DE TRANSPARENCIA (SATÉLITE)
           ============================================== */
        .control-transparencia {
            position: absolute;
            bottom: 20px;
            left: 50%;
            transform: translateX(-50%);
            background: rgba(255, 255, 255, 0.92);
            backdrop-filter: blur(8px);
            padding: 8px 16px;
            border-radius: 20px;
            box-shadow: 0 2px 12px rgba(0, 0, 0, 0.10);
            border: 1px solid rgba(255, 255, 255, 0.3);
            z-index: 1000;
            display: none;
            align-items: center;
            gap: 10px;
            min-width: 200px;
            transition: all 0.3s ease;
        }
        .control-transparencia.visible {
            display: flex;
        }
        .control-transparencia label {
            font-size: 11px;
            font-weight: 600;
            color: #333;
            white-space: nowrap;
        }
        .control-transparencia input[type="range"] {
            width: 120px;
            height: 4px;
            -webkit-appearance: none;
            appearance: none;
            background: #ddd;
            border-radius: 2px;
            outline: none;
        }
        .control-transparencia input[type="range"]::-webkit-slider-thumb {
            -webkit-appearance: none;
            appearance: none;
            width: 16px;
            height: 16px;
            border-radius: 50%;
            background: #2e9d36;
            cursor: pointer;
            border: 2px solid white;
            box-shadow: 0 1px 4px rgba(0, 0, 0, 0.2);
        }
        .control-transparencia input[type="range"]::-moz-range-thumb {
            width: 16px;
            height: 16px;
            border-radius: 50%;
            background: #2e9d36;
            cursor: pointer;
            border: 2px solid white;
            box-shadow: 0 1px 4px rgba(0, 0, 0, 0.2);
        }
        .control-transparencia .valor-opacidad {
            font-size: 11px;
            font-weight: 600;
            color: #2e9d36;
            min-width: 32px;
            text-align: center;
        }

        @media (max-width: 480px) {
            .control-transparencia {
                padding: 6px 12px;
                min-width: 160px;
                bottom: 14px;
            }
            .control-transparencia label {
                font-size: 10px;
            }
            .control-transparencia input[type="range"] {
                width: 80px;
            }
            .control-transparencia .valor-opacidad {
                font-size: 10px;
                min-width: 28px;
            }
        }

        @media (max-width: 480px) {
            .leaflet-control-layers {
                font-size: 12px !important;
                padding: 4px 8px !important;
                max-width: 180px !important;
            }
            .leaflet-control-layers label {
                font-size: 12px !important;
                gap: 3px !important;
            }
            .leaflet-control-layers input[type="checkbox"],
            .leaflet-control-layers input[type="radio"] {
                width: 16px !important;
                height: 16px !important;
            }
        }

        .leaflet-control-attribution {
            font-size: 9px !important;
            opacity: 0.6 !important;
        }

        @keyframes pulse-red { 
            0%{transform:scale(1)} 
            50%{transform:scale(1.25)} 
            100%{transform:scale(1)} 
        }
        @keyframes pulse-green { 
            0%{transform:scale(1)} 
            50%{transform:scale(1.35)} 
            100%{transform:scale(1)} 
        }
    </style>
</head>
<body>
    <div id="map"></div>

    <!-- BOTÓN MINIMIZAR/MOSTRAR CAPAS -->
    <button class="btn-toggle-capas pulsante" id="btnToggleCapas" title="📋 Toca para ver las capas del mapa">
        📋
        <span class="badge">▼</span>
    </button>

    <!-- LEYENDA (MINIMIZABLE Y REUBICADA) -->
    <div class="legend" id="leyenda">
        <div class="legend-header" id="legendHeader">
            <div class="legend-title">Mapa Emergencia</div>
            <button class="legend-toggle" id="legendToggle" title="Minimizar">▲</button>
        </div>
        <div class="legend-body" id="legendBody">
            <div class="legend-item">
                <div class="legend-icon centro">1</div>
                <span class="legend-label">Centro de Evacuación</span>
            </div>
            <div class="legend-item">
                <div class="legend-icon punto-encuentro">●</div>
                <span class="legend-label">Punto Encuentro <small>Organiza traslado al refugio</small></span>
            </div>
            <div class="legend-item">
                <div class="legend-icon via-segura"></div>
                <span class="legend-label">Vía Segura <small>Ruta prioritaria</small></span>
            </div>
            <div class="legend-telefonos">
                <button class="btn-telefonos" id="btnTelefonos">
                    <svg width="16" height="16" viewBox="0 0 24 24" fill="none" 
                         xmlns="http://www.w3.org/2000/svg" style="vertical-align:middle;flex-shrink:0;">
                      <path d="M6.6 10.8c1.4 2.8 3.8 5.1 6.6 6.6l2.2-2.2c.3-.3.7-.4 1-.2 
                               1.1.4 2.3.6 3.5.6.6 0 1 .4 1 1V20c0 .6-.4 1-1 1C10.6 21 3 13.4 3 4c0-.6.4-1 1-1h3.5
                               c.6 0 1 .4 1 1 0 1.2.2 2.4.6 3.5.1.4 0 .8-.2 1l-2.3 2.3z" 
                            fill="#FFFFFF"/>
                    </svg>
                    Teléfonos
                </button>
            </div>
        </div>
    </div>

    <!-- POPUP DE TELÉFONOS -->
    <div class="telefonos-popup" id="telefonosPopup">
        <div class="telefonos-popup-content">
            <button class="cerrar" id="cerrarTelefonos">✕</button>
            <div class="popup-titulo">Contactos de Emergencia</div>
            <div class="contacto">
                <div class="emoji">🏛️</div>
                <div class="info">
                    <div class="nombre">Centro de Monitoreo Municipal</div>
                    <div class="detalle">Emergencias las 24hs</div>
                    <div class="telefono">📞 4972398</div>
                </div>
            </div>
            <div class="contacto">
                <div class="emoji">🏢</div>
                <div class="info">
                    <div class="nombre">Municipalidad</div>
                    <div class="detalle">Horario de atención: 7:00 a 13:00</div>
                    <div class="telefono">📞 4971707</div>
                </div>
            </div>
        </div>
    </div>

    <!-- CONTROL DE TRANSPARENCIA (SATÉLITE) -->
    <div class="control-transparencia" id="controlTransparencia">

        // --- FUNCIONES DE ICONOS ---
        function crearIconoCentro(numero) {
            return L.divIcon({
                className: 'custom-icon',
                html: `<div style="background:#D32F2F;width:34px;height:34px;border-radius:50%;border:2px solid white;box-shadow:0 2px 12px rgba(211,47,47,0.4);display:flex;align-items:center;justify-content:center;font-size:14px;font-weight:700;color:white;font-family:system-ui;">${numero}</div>`,
                iconSize: [34, 34],
                iconAnchor: [17, 17]
            });
        }

        const iconoBarrial = L.divIcon({
            className: 'custom-icon',
            html: `<div style="background:#388E3C;width:20px;height:20px;border-radius:50%;border:2px solid white;box-shadow:0 2px 8px rgba(56,142,60,0.3);"></div>`,
            iconSize: [20, 20],
            iconAnchor: [10, 10]
        });

        // --- CREAR CAPA EMERGENCIA HÍDRICA ---
        var capaEmergenciaHidrica = L.layerGroup();

        // 1. Vías seguras (GeoJSON) - EN NARANJA CON LÍNEA DE PUNTOS
        const features = viasSegurasData.map(v => ({
            type: 'Feature',
            properties: { nombre: v.nombre, id: v.id },
            geometry: {
                type: 'LineString',
                coordinates: v.coordenadas.map(c => [c[1], c[0]])
            }
        }));

        // ==============================================
// VÍAS SEGURAS — VISUAL + ÁREA TÁCTIL INVISIBLE
// ==============================================
const viasGeoJSON = { type: 'FeatureCollection', features: features };

// 1. CAPA VISUAL: línea naranja punteada (lo que el usuario ve)
const viasLayerVisual = L.geoJSON(viasGeoJSON, {
    style: {
        color: '#FF6F00',
        weight: 4,
        opacity: 0.8,
        dashArray: '8, 6',
        smoothFactor: 1,
        interactive: false  // la capa visual no capta toques
    }
});

viasLayerVisual.addTo(capaEmergenciaHidrica);

// 2. CAPA TÁCTIL: invisible, más gruesa, capta toques y clics
// Se dibuja DEBAJO de la visual para no taparla
const viasLayerHit = L.geoJSON(viasGeoJSON, {
    style: {
        color: '#FF6F00',
        weight: 30,          // área de golpe de 30px (cómoda para el dedo)
        opacity: 0,          // invisible
        fillOpacity: 0,
        smoothFactor: 1,
        lineCap: 'round',
        lineJoin: 'round'
        // sin dashArray: la zona táctil es CONTINUA, no punteada
    },
    onEachFeature: (f, layer) => {
        // Tooltip flotante (aparece cerca del toque, se va solo)
        layer.bindTooltip(
            `<div style="text-align:center;padding:2px 4px;">
                <strong style="color:#FF6F00;font-size:12px;">🛡️ ${f.properties.nombre}</strong>
             </div>`,
            {
                sticky: true,        // sigue al cursor/dedo
                direction: 'top',
                offset: [0, -6],
                opacity: 0.95,
                className: 'tooltip-via-segura'
            }
        );

        // También dejamos el popup con info ampliada al hacer clic sostenido
        layer.bindPopup(
            `<div style="text-align:center;padding:4px;">
                <strong style="color:#FF6F00;">🛡️ ${f.properties.nombre}</strong>
                <p style="font-size:10px;color:#555;margin-top:2px;">Vía segura prioritaria</p>
             </div>`
        );

        // En mobile: el toque abre el tooltip; el doble toque o long-press abre el popup
        layer.on('click', function(e) {
            this.openTooltip(e.latlng);
        });
    }
});

viasLayerHit.addTo(capaEmergenciaHidrica);

        // 2. Centros de evacuados (con popups detallados)
        centrosEvacuados.forEach(p => {
            const marker = L.marker([p.lat, p.lng], { icon: crearIconoCentro(p.id) }).addTo(capaEmergenciaHidrica);
            marker.bindPopup(
                `<div style="text-align:left;padding:8px;max-width:220px;">
                    <strong style="color:#D32F2F;font-size:14px;">🏥 ${p.nombre}</strong>
                    <p style="font-size:12px;color:#333;margin:4px 0;"><strong>${p.detalle}</strong></p>
                    <p style="font-size:11px;color:#555;margin:2px 0;">📍 ${p.direccion}</p>

            );

        // 3. Puntos de encuentro barrial (con popup estandarizado)
        puntosBarriales.forEach(p => {
            const marker = L.marker([p.lat, p.lng], { icon: iconoBarrial }).addTo(capaEmergenciaHidrica);
            marker.bindPopup(

                    <strong style="color:#388E3C;font-size:13px;">📍 ${p.nombre}</strong>
                    <p style="font-size:11px;color:#555;margin:4px 0;">Punto de Encuentro Barrial</p>

            );

        // ==============================================
        // CONTROL DE CAPAS
        // ==============================================

        var capasBase = {
            '🗺️ Mapa': mapaBase,
            '🛰️ Satélite': sateliteEsri
        };

        var capasSuperpuestas = {
            '〰️ Curvas de nivel': capaCurvasYDefensas,
            '🔵 Puntos de cota IGN': capaPuntosCota,
            '🚨 Emergencia Hídrica': capaEmergenciaHidrica
        };

        var overlayControl = null;
        var leyendaElement = document.getElementById('leyenda');
        var controlTransparencia = document.getElementById('controlTransparencia');
        var sliderOpacidad = document.getElementById('opacidadSatelite');
        var valorOpacidad = document.getElementById('valorOpacidad');
        var btnToggleCapas = document.getElementById('btnToggleCapas');
        var btnTelefonos = document.getElementById('btnTelefonos');
        var telefonosPopup = document.getElementById('telefonosPopup');
        var cerrarTelefonos = document.getElementById('cerrarTelefonos');
        var legendHeader = document.getElementById('legendHeader');
        var legendToggle = document.getElementById('legendToggle');
        var legendBody = document.getElementById('legendBody');
        var capasMinimizadas = true;
        var leyendaColapsada = false;

        // ==============================================
        // BOTÓN TELÉFONOS
        // ==============================================
        btnTelefonos.addEventListener('click', function(e) {
            e.stopPropagation();
            telefonosPopup.classList.add('visible');
        });

        cerrarTelefonos.addEventListener('click', function() {
            telefonosPopup.classList.remove('visible');
        });

        telefonosPopup.addEventListener('click', function(e) {
            if (e.target === this) {
                this.classList.remove('visible');
            }
        });

        // ==============================================
        // LEYENDA MINIMIZABLE
        // ==============================================
        function toggleLeyenda() {
            leyendaColapsada = !leyendaColapsada;
            if (leyendaColapsada) {
                legendBody.classList.add('colapsado');
                legendToggle.textContent = '▼';
                legendToggle.title = 'Expandir';
            } else {
                legendBody.classList.remove('colapsado');
                legendToggle.textContent = '▲';
                legendToggle.title = 'Minimizar';
            }
        }

        legendHeader.addEventListener('click', toggleLeyenda);
        legendToggle.addEventListener('click', function(e) {
            e.stopPropagation();
            toggleLeyenda();
        });

        // ==============================================
        // FUNCIONES DEL MAPA
        // ==============================================

        function centrarEnEmergenciaHidrica() {
            const coords = centrosEvacuados.map(c => [c.lat, c.lng]);
            const latlngs = coords.map(c => L.latLng(c[0], c[1]));
            const bounds = L.latLngBounds(latlngs);
            map.fitBounds(bounds, {
                padding: [50, 50],
                maxZoom: 15
            });
        }

        function configurarEmergenciaHidrica(activado) {
            if (activado) {
                map.removeLayer(sateliteEsri);
                if (!map.hasLayer(mapaBase)) {
                    mapaBase.addTo(map);
                }
                if (map.hasLayer(capaCurvasYDefensas)) {
                    map.removeLayer(capaCurvasYDefensas);
                }
                if (map.hasLayer(capaPuntosCota)) {
                    map.removeLayer(capaPuntosCota);
                }
                leyendaElement.classList.add('visible');
                controlTransparencia.classList.remove('visible');
                setTimeout(() => {
                    centrarEnEmergenciaHidrica();
                }, 300);
                setTimeout(() => {
                    document.querySelectorAll('.leaflet-control-layers-overlays input[type="checkbox"]').forEach(input => {
                        const label = input.parentElement;
                        if (label.textContent.includes('Curvas de nivel') || label.textContent.includes('Puntos de cota')) {
                            input.checked = false;
                        }
                    });
                }, 50);
            } else {
                leyendaElement.classList.remove('visible');
                if (map.hasLayer(sateliteEsri)) {
                    controlTransparencia.classList.add('visible');
                }
                map.setView(CENTRO_MAPA, ZOOM_INICIAL);
            }
        }

        function manejarCambioBase() {
            const sateliteActivo = map.hasLayer(sateliteEsri);
            if (sateliteActivo) {
                controlTransparencia.classList.add('visible');
                const opacidadActual = sateliteEsri.options.opacity || 1.0;
                const valor = Math.round(opacidadActual * 100);
                sliderOpacidad.value = valor;
                valorOpacidad.textContent = valor + '%';
            } else {
                controlTransparencia.classList.remove('visible');
            }
        }

        // ==============================================
        // BOTÓN MINIMIZAR/MOSTRAR CAPAS
        // ==============================================
        btnToggleCapas.addEventListener('click', function() {
            capasMinimizadas = !capasMinimizadas;
            const controlLayers = document.querySelector('.leaflet-control-layers');
            if (controlLayers) {
                if (capasMinimizadas) {
                    controlLayers.classList.add('minimizado');
                    this.classList.add('oculto');
                    this.classList.remove('pulsante');
                    this.querySelector('.badge').textContent = '▲';
                } else {
                    controlLayers.classList.remove('minimizado');
                    this.classList.remove('oculto');
                    this.classList.remove('pulsante');
                    this.querySelector('.badge').textContent = '▼';
                }
            }
        });

        btnToggleCapas.classList.add('visible');

        // ==============================================
        // CONTROL DE CAPAS (CREACIÓN)
        // ==============================================
        
        overlayControl = L.control.layers(capasBase, capasSuperpuestas, {
            position: 'topright',
            collapsed: false
        });

        overlayControl.addTo(map);

        // INICIALIZAR CON EL PANEL MINIMIZADO
        setTimeout(() => {
            const controlLayers = document.querySelector('.leaflet-control-layers');
            if (controlLayers) {
                controlLayers.classList.add('minimizado');
                btnToggleCapas.classList.add('oculto');
                btnToggleCapas.classList.add('pulsante');
                btnToggleCapas.querySelector('.badge').textContent = '▲';
            }
        }, 200);

        // Monitorear cambios en las capas base
        map.on('baselayerchange', function(e) {
            manejarCambioBase();
        });

        // Detectar cambios en las capas superpuestas
        setTimeout(() => {
            const overlayContainer = document.querySelector('.leaflet-control-layers-overlays');
            if (overlayContainer) {
                const observer = new MutationObserver(() => {
                    const inputs = overlayContainer.querySelectorAll('input[type="checkbox"]');
                    inputs.forEach(input => {
                        const label = input.parentElement;
                        if (label.textContent.includes('Emergencia Hídrica')) {
                            const activado = input.checked;
                            configurarEmergenciaHidrica(activado);
                        }
                    });
                });
                observer.observe(overlayContainer, {
                    childList: true,
                    subtree: true,
                    attributes: true,
                    attributeFilter: ['checked']
                });
            }
        }, 300);

        document.addEventListener('click', function(e) {
            const target = e.target;
            if (target.type === 'checkbox') {
                const label = target.parentElement;
                if (label && label.textContent && label.textContent.includes('Emergencia Hídrica')) {
                    setTimeout(() => {
                        configurarEmergenciaHidrica(target.checked);
                    }, 50);
                }
            }
        });

        // ==============================================
        // CONTROL DE TRANSPARENCIA
        // ==============================================
        sliderOpacidad.addEventListener('input', function() {
            const valor = parseInt(this.value);
            const opacidad = valor / 100;
            valorOpacidad.textContent = valor + '%';
            sateliteEsri.setOpacity(opacidad);
        });

        manejarCambioBase();

        // ==============================================
        // AJUSTE DE TAMAÑO
        // ==============================================
