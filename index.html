<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#2d6a3f">
<title>Mapa de Datos Hídricos - Vecinal Rincón Norte</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<style>
  :root {
    --verde: #2d6a3f;
    --verde-oscuro: #1b4332;
    --verde-claro: #e9f5ed;
    --verde-muy-claro: #f5faf6;
    --fondo: #f3f4f6;
    --texto: #111827;
    --muted: #4b5563;
    --borde: #e5e7eb;
    --rojo: #dc2626;
    --naranja: #d97706;
    --sombra-sm: 0 2px 8px rgba(0,0,0,0.06);
    --sombra-md: 0 10px 25px -5px rgba(0,0,0,0.10), 0 8px 10px -6px rgba(0,0,0,0.06);
    --sombra-lg: 0 24px 48px rgba(0,0,0,0.20);
    --sombra-zocalo: 0 -4px 16px rgba(0,0,0,0.06);
    --radio-sm: 10px;
    --radio-md: 14px;
    --radio-lg: 20px;
    --header-height: 84px;
    --zocalo-height: 54px;
  }
  * { box-sizing: border-box; }
  html, body {
    margin: 0; padding: 0;
    width: 100%; height: 100%;
    overflow: hidden;
    font-family: 'Inter', system-ui, -apple-system, "Segoe UI", sans-serif;
    background: var(--fondo);
    color: var(--texto);
    -webkit-text-size-adjust: 100%;
  }

  /* HEADER */
  header.app-header {
    position: fixed;
    top: 0; left: 0; right: 0;
    z-index: 2000;
    height: var(--header-height);
    padding: 10px 12px;
    padding-top: calc(10px + env(safe-area-inset-top, 0px));
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 12px;
    color: #fff;
    background: linear-gradient(135deg, var(--verde) 0%, var(--verde-oscuro) 100%);
    box-shadow: 0 4px 16px rgba(27, 67, 50, 0.25);
  }
  header.app-header .logo-caja {
    flex-shrink: 0;
    background: #fff;
    border-radius: 14px;
    padding: 6px 10px;
    display: flex; align-items: center; justify-content: center;
    box-shadow: 0 2px 12px rgba(0,0,0,.18);
    min-width: 68px; min-height: 68px;
    max-width: 130px;
    overflow: hidden;
  }
  header.app-header .logo-caja img {
    max-height: 64px; max-width: 110px;
    width: auto; height: auto;
    object-fit: contain; display: block;
  }
  header.app-header .logo-caja .placeholder-logo {
    font-size: 8px;
    color: var(--muted);
    text-align: center;
    line-height: 1.15;
    font-weight: 600;
    padding: 4px;
  }
  header.app-header .btn-capas-header {
    flex-shrink: 0;
    display: inline-flex;
    align-items: center;
    justify-content: center;
    gap: 8px;
    padding: 0 16px;
    min-height: 44px;
    background: rgba(255,255,255,0.15);
    border: 1px solid rgba(255,255,255,0.45);
    color: #fff;
    border-radius: 12px;
    font-family: inherit;
    font-size: 0.8rem;
    font-weight: 700;
    cursor: pointer;
    transition: background 0.18s, color 0.18s, border-color 0.18s;
    white-space: nowrap;
    line-height: 1;
  }
  header.app-header .btn-capas-header:hover { background: rgba(255,255,255,0.28); }
  header.app-header .btn-capas-header.abierto {
    background: #fff;
    color: var(--verde-oscuro);
    border-color: #fff;
  }
  header.app-header .btn-capas-header .caret {
    display: inline-block;
    font-size: 0.6rem;
    line-height: 1;
    opacity: 0.9;
    transition: transform 0.2s;
  }
  header.app-header .btn-capas-header.abierto .caret { transform: rotate(180deg); }

  /* PANEL DE CAPAS */
  .panel-capas {
    position: fixed;
    top: calc(var(--header-height) + env(safe-area-inset-top, 0px) + 8px);
    right: 12px;
    z-index: 1999;
    width: 210px;
    max-width: calc(100vw - 24px);
    background: #fff;
    border: 1px solid var(--borde);
    border-radius: var(--radio-md);
    box-shadow: var(--sombra-lg);
    padding: 6px;
    display: none;
    overflow: hidden;
  }
  .panel-capas.abierto { display: block; }

  .panel-capas .grupo-titulo {
    font-size: 0.56rem;
    font-weight: 800;
    text-transform: uppercase;
    letter-spacing: 1.2px;
    color: var(--muted);
    padding: 6px 8px 3px;
    opacity: 0.75;
  }
  .panel-capas .grupo-titulo:first-child { padding-top: 2px; }

  .panel-capas .opcion {
    display: flex;
    align-items: center;
    gap: 8px;
    width: 100%;
    text-align: left;
    padding: 8px 10px;
    background: transparent;
    border: none;
    border-radius: 8px;
    font-family: inherit;
    font-size: 0.74rem;
    font-weight: 600;
    color: var(--texto);
    cursor: pointer;
    transition: background 0.15s, color 0.15s, opacity 0.15s;
  }
  .panel-capas .opcion:hover { background: var(--verde-muy-claro); }
  .panel-capas .opcion.activo {
    background: var(--verde-claro);
    color: var(--verde-oscuro);
  }
  .panel-capas .opcion .emoji {
    font-size: 0.9rem;
    width: 18px;
    text-align: center;
    flex-shrink: 0;
    line-height: 1;
  }
  .panel-capas .opcion .texto {
    flex: 1;
    min-width: 0;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }
  .panel-capas .opcion .check {
    font-weight: 800;
    font-size: 0.82rem;
    opacity: 0;
    transition: opacity 0.15s;
    flex-shrink: 0;
    color: var(--verde-oscuro);
  }
  .panel-capas .opcion.activo .check { opacity: 1; }

  /* Opción bloqueada */
  .panel-capas .opcion.bloqueada {
    color: var(--muted);
    opacity: 0.45;
    cursor: not-allowed;
    pointer-events: none;
  }
  .panel-capas .opcion.bloqueada:hover { background: transparent; }

  .panel-capas .aviso-bloqueada {
    font-size: 0.62rem;
    font-weight: 600;
    color: var(--muted);
    opacity: 0.7;
    padding: 0 10px 6px 36px;
    line-height: 1.2;
  }

  .panel-capas .separador {
    height: 1px;
    background: var(--borde);
    margin: 5px 4px;
  }

  .panel-capas .transparencia-caja {
    padding: 4px 10px 8px;
    display: none;
    align-items: center;
    gap: 8px;
  }
  .panel-capas .transparencia-caja.visible { display: flex; }
  .panel-capas .transparencia-caja label {
    font-size: 0.62rem;
    font-weight: 600;
    color: var(--muted);
    white-space: nowrap;
  }
  .panel-capas .transparencia-caja input[type="range"] {
    flex: 1;
    height: 4px;
    -webkit-appearance: none;
    appearance: none;
    background: var(--borde);
    border-radius: 2px;
    outline: none;
  }
  .panel-capas .transparencia-caja input[type="range"]::-webkit-slider-thumb {
    -webkit-appearance: none;
    appearance: none;
    width: 14px; height: 14px;
    border-radius: 50%;
    background: var(--verde);
    cursor: pointer;
    border: 2px solid #fff;
    box-shadow: 0 1px 4px rgba(0,0,0,0.2);
  }
  .panel-capas .transparencia-caja input[type="range"]::-moz-range-thumb {
    width: 14px; height: 14px;
    border-radius: 50%;
    background: var(--verde);
    cursor: pointer;
    border: 2px solid #fff;
    box-shadow: 0 1px 4px rgba(0,0,0,0.2);
  }
  .panel-capas .transparencia-caja .valor-opacidad {
    font-size: 0.62rem;
    font-weight: 700;
    color: var(--verde-oscuro);
    min-width: 30px;
    text-align: right;
    font-variant-numeric: tabular-nums;
  }

  /* MAPA */
  #map {
    position: absolute;
    top: 0; left: 0; right: 0; bottom: 0;
    background: var(--fondo);
    z-index: 1;
  }
  .leaflet-top {
    top: calc(var(--header-height) + env(safe-area-inset-top, 0px)) !important;
  }
  .leaflet-bottom {
    bottom: calc(var(--zocalo-height) + env(safe-area-inset-bottom, 0px)) !important;
  }
  body.sin-zocalo .leaflet-bottom {
    bottom: env(safe-area-inset-bottom, 0px) !important;
  }

  /* ZÓCALO (sin indicador rojo a la izquierda) */
  .zocalo {
    position: fixed;
    left: 0; right: 0;
    bottom: 0;
    z-index: 2001;
    height: calc(var(--zocalo-height) + env(safe-area-inset-bottom, 0px));
    padding-bottom: env(safe-area-inset-bottom, 0px);
    background: #fff;
    border-top: 1px solid var(--borde);
    box-shadow: var(--sombra-zocalo);
    display: flex;
    align-items: center;
    gap: 8px;
    padding-left: 12px;
    padding-right: 8px;
    transform: translateY(100%);
    transition: transform 0.28s ease;
  }
  .zocalo.visible { transform: translateY(0); }
  .zocalo .refs {
    flex: 1;
    min-width: 0;
    display: flex;
    align-items: center;
    gap: 12px;
    overflow-x: auto;
    overflow-y: hidden;
    -webkit-overflow-scrolling: touch;
    scrollbar-width: none;
    padding: 4px 0;
  }
  .zocalo .refs::-webkit-scrollbar { display: none; }
  .zocalo .ref {
    flex-shrink: 0;
    display: flex;
    align-items: center;
    gap: 5px;
    white-space: nowrap;
  }
  .zocalo .ref .icono-ref {
    flex-shrink: 0;
    width: 18px; height: 18px;
    display: flex; align-items: center; justify-content: center;
  }
  /* Centro: círculo rojo sin número, con borde blanco */
  .zocalo .ref .icono-ref.centro {
    background: var(--rojo);
    border-radius: 50%;
    box-shadow:
      0 0 0 2px #fff,
      0 1px 3px rgba(220, 38, 38, 0.35);
  }
  .zocalo .ref .icono-ref.peb { position: relative; }
  .zocalo .ref .icono-ref.peb::before {
    content: '';
    width: 11px; height: 11px;
    border-radius: 50%;
    background: var(--verde);
    border: 2px solid #fff;
    box-shadow: 0 1px 3px rgba(45, 106, 63, 0.35);
    display: block;
  }
  .zocalo .ref .icono-ref.via::before {
    content: '';
    width: 18px; height: 0;
    border-top: 3px dashed var(--naranja);
    display: block;
  }
  .zocalo .ref .texto-ref {
    font-size: 0.68rem;
    font-weight: 600;
    color: var(--verde-oscuro);
    line-height: 1;
  }
  .zocalo .btn-tel {
    flex-shrink: 0;
    width: 36px; height: 36px;
    display: flex; align-items: center; justify-content: center;
    background: var(--verde);
    color: #fff;
    border: none;
    border-radius: 50%;
    cursor: pointer;
    box-shadow: 0 2px 8px rgba(45, 106, 63, 0.3);
    transition: background 0.15s, transform 0.1s;
  }
  .zocalo .btn-tel:active {
    transform: scale(0.92);
    background: var(--verde-oscuro);
  }
  .zocalo .btn-tel svg { width: 16px; height: 16px; }

  /* MODAL TELÉFONOS */
  .popup-overlay {
    position: fixed; inset: 0;
    background: rgba(0, 0, 0, 0.5);
    backdrop-filter: blur(4px);
    -webkit-backdrop-filter: blur(4px);
    z-index: 9999;
    display: none;
    align-items: center; justify-content: center;
    padding: 12px;
    opacity: 0;
    transition: opacity 0.25s ease;
  }
  .popup-overlay.visible { display: flex; opacity: 1; }
  .popup-caja {
    background: #fff;
    border-radius: var(--radio-lg);
    width: 100%; max-width: 420px;
    max-height: calc(100dvh - 24px);
    display: flex; flex-direction: column;
    box-shadow: 0 24px 64px rgba(0,0,0,0.35);
    overflow: hidden;
    transform: translateY(10px) scale(0.98);
    transition: transform 0.25s ease;
  }
  .popup-overlay.visible .popup-caja { transform: translateY(0) scale(1); }
  .popup-header {
    background: linear-gradient(135deg, var(--verde) 0%, var(--verde-oscuro) 100%);
    color: #fff;
    padding: 14px 20px;
    text-align: center;
    flex-shrink: 0;
  }
  .popup-header h2 { font-size: 1rem; margin: 0; font-weight: 700; }
  .popup-header .popup-sub { font-size: 0.7rem; opacity: 0.85; margin-top: 2px; }
  .popup-cuerpo {
    padding: 8px 16px;
    overflow-y: auto;
    flex: 1;
    min-height: 0;
  }
  .popup-cuerpo .contacto {
    display: flex;
    gap: 12px;
    padding: 12px 0;
    border-bottom: 1px dashed var(--borde);
  }
  .popup-cuerpo .contacto:last-child { border-bottom: none; }
  .popup-cuerpo .contacto .emoji {
    font-size: 1.2rem;
    width: 32px;
    text-align: center;
    flex-shrink: 0;
    line-height: 1.2;
  }
  .popup-cuerpo .contacto .info { flex: 1; min-width: 0; }
  .popup-cuerpo .contacto .nombre {
    font-size: 0.82rem;
    font-weight: 700;
    color: var(--verde-oscuro);
    line-height: 1.2;
  }
  .popup-cuerpo .contacto .detalle {
    font-size: 0.68rem;
    color: var(--muted);
    margin-top: 2px;
  }
  .popup-cuerpo .contacto .telefono {
    font-size: 0.88rem;
    font-weight: 700;
    color: var(--verde-oscuro);
    margin-top: 5px;
    display: inline-block;
    background: var(--verde-claro);
    padding: 4px 12px;
    border-radius: 8px;
  }
  .popup-footer {
    padding: 12px 16px 14px;
    padding-bottom: calc(14px + env(safe-area-inset-bottom, 0px));
    flex-shrink: 0;
    border-top: 1px solid var(--borde);
  }
  .popup-btn-cerrar {
    width: 100%;
    padding: 13px;
    background: #fff;
    color: var(--verde-oscuro);
    border: 1px solid var(--verde);
    border-radius: var(--radio-md);
    font-family: inherit;
    font-size: 0.85rem;
    font-weight: 700;
    cursor: pointer;
    min-height: 48px;
  }

  /* Tooltip vías seguras */
  .tooltip-via-segura {
    background: rgba(255, 255, 255, 0.96) !important;
    border: 1px solid rgba(217, 119, 6, 0.3) !important;
    border-radius: 8px !important;
    box-shadow: 0 2px 8px rgba(0, 0, 0, 0.15) !important;
    color: #333 !important;
    padding: 4px 8px !important;
    font-family: 'Inter', system-ui, sans-serif !important;
  }
  .tooltip-via-segura::before {
    border-top-color: rgba(255, 255, 255, 0.96) !important;
  }
  .leaflet-overlay-pane svg path:focus,
  .leaflet-overlay-pane svg path:active,
  .leaflet-interactive:focus,
  .leaflet-interactive:active {
    outline: none !important;
    -webkit-tap-highlight-color: transparent !important;
  }

  /* RESPONSIVE */
  @media (max-width: 560px) {
    :root { --header-height: 84px; --zocalo-height: 52px; }
    header.app-header {
      padding: 10px 12px;
      padding-top: calc(10px + env(safe-area-inset-top, 0px));
      gap: 10px;
    }
    header.app-header .logo-caja {
      min-width: 56px; min-height: 56px;
      padding: 4px 8px;
      border-radius: 12px;
    }
    header.app-header .logo-caja img { max-height: 50px; max-width: 90px; }
    header.app-header .btn-capas-header {
      min-height: 42px;
      padding: 0 12px;
      font-size: 0.72rem;
    }
    .panel-capas {
      width: 190px;
      right: 8px;
      top: calc(var(--header-height) + env(safe-area-inset-top, 0px) + 6px);
    }
    .panel-capas .opcion {
      font-size: 0.72rem;
      padding: 8px 9px;
    }
    .zocalo { padding-left: 10px; padding-right: 6px; gap: 6px; }
    .zocalo .refs { gap: 9px; }
    .zocalo .ref .texto-ref { font-size: 0.62rem; }
    .zocalo .btn-tel { width: 34px; height: 34px; }
  }
  @media (min-width: 768px) {
    :root { --header-height: 84px; --zocalo-height: 58px; }
    header.app-header { padding: 14px 20px; }
    header.app-header .logo-caja { min-width: 76px; min-height: 76px; }
    header.app-header .logo-caja img { max-height: 68px; max-width: 110px; }
    header.app-header .btn-capas-header { min-height: 46px; font-size: 0.82rem; }
    .panel-capas { width: 220px; }
    .zocalo {
      max-width: 720px;
      left: 50%;
      right: auto;
      transform: translateX(-50%) translateY(100%);
      border-radius: var(--radio-md) var(--radio-md) 0 0;
      padding-left: 16px;
      padding-right: 14px;
      gap: 12px;
    }
    .zocalo.visible {
      transform: translateX(-50%) translateY(0);
    }
    .zocalo .refs { gap: 18px; justify-content: center; }
    .zocalo .ref .texto-ref { font-size: 0.74rem; }
    .zocalo .btn-tel { width: 38px; height: 38px; }
  }
</style>
</head>

function crearIconoCentro(numero) {
  return L.divIcon({
    className: 'custom-icon',
    html: `<div style="background:#dc2626;width:34px;height:34px;border-radius:50%;border:2px solid white;box-shadow:0 2px 12px rgba(220,38,38,0.4);display:flex;align-items:center;justify-content:center;font-size:14px;font-weight:700;color:white;font-family:'Inter',system-ui,sans-serif;">${numero}</div>`,
    iconSize: [34, 34],
    iconAnchor: [17, 17]
  });
}
const iconoBarrial = L.divIcon({
  className: 'custom-icon',
  html: `<div style="background:#2d6a3f;width:20px;height:20px;border-radius:50%;border:2px solid white;box-shadow:0 2px 8px rgba(45,106,63,0.3);"></div>`,
  iconSize: [20, 20],
  iconAnchor: [10, 10]
});

const capaEmergenciaHidrica = L.layerGroup();

const features = viasSegurasData.map(v => ({
  type: 'Feature',
  properties: { nombre: v.nombre, id: v.id },
  geometry: { type: 'LineString', coordinates: v.coordenadas.map(c => [c[1], c[0]]) }
}));
const viasGeoJSON = { type: 'FeatureCollection', features };

L.geoJSON(viasGeoJSON, {
  style: { color: '#d97706', weight: 4, opacity: 0.8, dashArray: '8, 6', smoothFactor: 1, interactive: false }
}).addTo(capaEmergenciaHidrica);

L.geoJSON(viasGeoJSON, {
  style: { color: '#d97706', weight: 30, opacity: 0, fillOpacity: 0, smoothFactor: 1, lineCap: 'round', lineJoin: 'round' },
  onEachFeature: (f, layer) => {
    layer.bindTooltip(
      `<div style="text-align:center;padding:2px 4px;">
        <strong style="color:#d97706;font-size:12px;">🛡️ ${f.properties.nombre}</strong>
      </div>`,
      { sticky: true, direction: 'top', offset: [0, -6], opacity: 0.95, className: 'tooltip-via-segura' }
    );
    layer.bindPopup(
      `<div style="text-align:center;padding:4px;">
        <strong style="color:#d97706;">🛡️ ${f.properties.nombre}</strong>
        <p style="font-size:10px;color:#555;margin-top:2px;">Vía segura prioritaria</p>
      </div>`
    );
    layer.on('click', function(e) { this.openTooltip(e.latlng); });
  }
}).addTo(capaEmergenciaHidrica);

centrosEvacuados.forEach(p => {
  const marker = L.marker([p.lat, p.lng], { icon: crearIconoCentro(p.id) }).addTo(capaEmergenciaHidrica);
  marker.bindPopup(
    `<div style="text-align:left;padding:8px;max-width:220px;">
      <strong style="color:#dc2626;font-size:14px;">🏥 ${p.nombre}</strong>
      <p style="font-size:12px;color:#333;margin:4px 0;"><strong>${p.detalle}</strong></p>
      <p style="font-size:11px;color:#555;margin:2px 0;">📍 ${p.direccion}</p>
    </div>`
  );
});

puntosBarriales.forEach(p => {
  const marker = L.marker([p.lat, p.lng], { icon: iconoBarrial }).addTo(capaEmergenciaHidrica);
  marker.bindPopup(
    `<div style="text-align:center;padding:6px;max-width:200px;">
      <strong style="color:#2d6a3f;font-size:13px;">📍 ${p.nombre}</strong>
      <p style="font-size:11px;color:#555;margin:4px 0;">Punto de Encuentro Barrial</p>
      <p style="font-size:10px;color:#777;margin:2px 0;">Desde este punto se organiza el traslado al Refugio correspondiente.</p>
    </div>`
  );
});

function centrarEnEmergenciaHidrica() {
  const coords = centrosEvacuados.map(c => [c.lat, c.lng]);
  const latlngs = coords.map(c => L.latLng(c[0], c[1]));
  const bounds = L.latLngBounds(latlngs);
  map.fitBounds(bounds, { padding: [50, 50], maxZoom: 15 });
}

const zocalo = document.getElementById('zocalo');
const body = document.body;

function actualizarZocalo() {
  if (estadoCapas.emergencia) {
    zocalo.classList.add('visible');
    body.classList.remove('sin-zocalo');
  } else {
    zocalo.classList.remove('visible');
    body.classList.add('sin-zocalo');
  }
}

// PANEL DE CAPAS
// ============================================
const btnCapasHeader = document.getElementById('btnCapasHeader');
const panelCapas = document.getElementById('panelCapas');

function renderPanelCapas() {
  const emergenciaBloqueada = !EMERGENCIA_DISPONIBLE;

  panelCapas.innerHTML = `
    <div class="grupo-titulo">Vista</div>
    <button class="opcion ${estadoCapas.base === 'mapa' ? 'activo' : ''}" data-tipo="base" data-valor="mapa">
      <span class="emoji">${ICONOS.mapa}</span>
      <span class="texto">Mapa</span>
      <span class="check">✓</span>
    </button>
    <button class="opcion ${estadoCapas.base === 'satelite' ? 'activo' : ''}" data-tipo="base" data-valor="satelite">
      <span class="emoji">${ICONOS.satelite}</span>
      <span class="texto">Satélite</span>
      <span class="check">✓</span>
    </button>
    <div class="transparencia-caja ${estadoCapas.base === 'satelite' ? 'visible' : ''}" id="transparenciaCaja">
      <label>Transparencia</label>
      <input type="range" id="opacidadSlider" min="0" max="100" value="${Math.round(sateliteEsri.options.opacity * 100)}">
      <span class="valor-opacidad" id="opacidadValor">${Math.round(sateliteEsri.options.opacity * 100)}%</span>
    </div>

    <div class="separador"></div>

    <div class="grupo-titulo">Capas</div>
    <button class="opcion ${estadoCapas.curvas ? 'activo' : ''}" data-tipo="overlay" data-valor="curvas">
      <span class="emoji">${ICONOS.curvas}</span>
      <span class="texto">Curvas de nivel</span>
      <span class="check">✓</span>
    </button>
    <button class="opcion ${estadoCapas.cotas ? 'activo' : ''}" data-tipo="overlay" data-valor="cotas">
      <span class="emoji">${ICONOS.cotas}</span>
      <span class="texto">Puntos de cota IGN</span>
      <span class="check">✓</span>
    </button>
    <button class="opcion ${estadoCapas.emergencia ? 'activo' : ''} ${emergenciaBloqueada ? 'bloqueada' : ''}"
            data-tipo="overlay" data-valor="emergencia"
            ${emergenciaBloqueada ? 'disabled' : ''}>
      <span class="emoji">${ICONOS.emergencia}</span>
      <span class="texto">Emergencia Hídrica</span>
      <span class="check">✓</span>
    </button>
    ${emergenciaBloqueada ? '<div class="aviso-bloqueada">Mapa inactivo</div>' : ''}
  `;

  panelCapas.querySelectorAll('.opcion').forEach(btn => {
    btn.addEventListener('click', (e) => {
      e.stopPropagation();
      if (btn.disabled) return;

      const tipo = btn.dataset.tipo;
      const valor = btn.dataset.valor;

      if (tipo === 'base') {
        if (estadoCapas.base === valor) return;
        if (valor === 'mapa') {
          map.removeLayer(sateliteEsri);
          mapaBase.addTo(map);
        } else {
          map.removeLayer(mapaBase);
          sateliteEsri.addTo(map);
        }
        estadoCapas.base = valor;
      } else {
        estadoCapas[valor] = !estadoCapas[valor];
        const capa = valor === 'curvas' ? capaCurvasYDefensas
                   : valor === 'cotas' ? capaPuntosCota
                   : capaEmergenciaHidrica;

        if (estadoCapas[valor]) {
          capa.addTo(map);

          // Al activar emergencia: apagar curvas y cotas, pasar a mapa base, centrar
          if (valor === 'emergencia') {
            if (estadoCapas.curvas) {
              map.removeLayer(capaCurvasYDefensas);
              estadoCapas.curvas = false;
            }
            if (estadoCapas.cotas) {
              map.removeLayer(capaPuntosCota);
              estadoCapas.cotas = false;
            }
            if (estadoCapas.base === 'satelite') {
              map.removeLayer(sateliteEsri);
              mapaBase.addTo(map);
              estadoCapas.base = 'mapa';
            }
            setTimeout(() => centrarEnEmergenciaHidrica(), 300);

            // Cerrar el panel de capas al activar emergencia
            cerrarPanelCapas();
          }
        } else {
          map.removeLayer(capa);
          if (valor === 'emergencia') {
            map.setView(CENTRO_MAPA, ZOOM_INICIAL);
          }
        }

        actualizarZocalo();
      }

      renderPanelCapas();
    });
  });

  const slider = document.getElementById('opacidadSlider');
  const valorEl = document.getElementById('opacidadValor');
  if (slider) {
    slider.addEventListener('input', (e) => {
      e.stopPropagation();
      const v = parseInt(slider.value);
      sateliteEsri.setOpacity(v / 100);
      valorEl.textContent = v + '%';
    });
    slider.addEventListener('click', (e) => e.stopPropagation());
  }
}

function abrirPanelCapas() {
  panelCapas.classList.add('abierto');
  btnCapasHeader.classList.add('abierto');
  btnCapasHeader.setAttribute('aria-expanded', 'true');
}

function cerrarPanelCapas() {
  panelCapas.classList.remove('abierto');
  btnCapasHeader.classList.remove('abierto');
  btnCapasHeader.setAttribute('aria-expanded', 'false');
}

renderPanelCapas();

btnCapasHeader.addEventListener('click', (e) => {
  e.stopPropagation();
  if (panelCapas.classList.contains('abierto')) {
    cerrarPanelCapas();
  } else {
    abrirPanelCapas();
  }
});

document.addEventListener('click', (e) => {
  if (!e.target.closest('#panelCapas') && !e.target.closest('#btnCapasHeader')) {
    cerrarPanelCapas();
  }
});

popupTelefonos.addEventListener('click', (e) => {
  if (e.target === popupTelefonos) popupTelefonos.classList.remove('visible');
});

// ============================================
// INICIALIZACIÓN
// ============================================
actualizarZocalo();
setTimeout(() => map.invalidateSize(), 200);
window.addEventListener('resize', () => setTimeout(() => map.invalidateSize(), 200));
</script>
